# Root pytest config for the Python runner shims + shared conformance suite (#161).
# Both shims ship tests/test_core.py with no __init__.py; the shared conformance suite lives in
# runners/conformance/ as test_engine_runner_contract.py. Collecting all three in ONE invocation
# collides on the duplicate tests/test_core.py basename between the two shims, under pytest's
# default (prepend) import mode. importlib mode imports each test module by file path, so
# `pytest runners/vllm/tests runners/mlserver/tests runners/conformance` collects cleanly.
# This root config is only picked up by the combined (repo-root) invocation; a per-shim
# `cd runners/<x> && pytest` still uses that shim's own [tool.pytest.ini_options].
[pytest]
addopts = --import-mode=importlib
