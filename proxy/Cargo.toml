[workspace]
members = ["."]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[package]
name = "sardeenz-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
