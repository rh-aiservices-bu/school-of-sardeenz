# Warnings that are correct-by-design, not defects.
#
# RoutingMapUpdate and RoutingPropagationBarrier are Redis pub/sub payloads,
# not HTTP operation bodies. They are consumed directly by the proxy.
#
# OipModelList — the shape of the proxy's own GET /oip/v2/models response.
# The proxy answers this route itself from the routing map (never forwarded)
# and is not an operation in this control-plane-facing spec, so no path can
# $ref it (see issue #125).
#
# ProxyProtocolSet — reachable over Redis (`{prefix}:proxy:protocols`), not
# HTTP. Written by the proxy at startup and read by the control plane's
# catalog-import forward-compat guard, so no path can $ref it (see issue #125).
specs/proxy-control-plane.yaml:
  no-unused-components:
    - '#/components/schemas/RoutingMapUpdate'
    - '#/components/schemas/RoutingPropagationBarrier'
    - '#/components/schemas/OipModelList'
    - '#/components/schemas/ProxyProtocolSet'

# WorkerInfo / WorkerMemoryReport — reachable over Redis, not HTTP. Workers
# publish them to `{prefix}:workers:{id}:{info,memory}` and the control plane
# discovers them by scanning, so no path can $ref them. They are used at
# runtime today; "never used" here means "never used by an operation".
specs/worker-agent.yaml:
  no-unused-components:
    - '#/components/schemas/WorkerInfo'
    - '#/components/schemas/WorkerMemoryReport'

# Neither catalog operation accepts a path parameter, query parameter, or
# request body, and neither handler has a 4XX code path (catalog.ts:19-38).
# The only failure modes are 502 and 500. Inventing a 4XX to satisfy the rule
# would make the spec less accurate.
#
# ClusterEvent — delivered over Redis pub/sub and the BFF SSE stream, not a
# JSON HTTP response, so no path can $ref it. It is used at runtime by the
# control plane (reconciliation, module store), the dashboard BFF, and the
# frontend via the generated types.
specs/control-plane.yaml:
  operation-4xx-response:
    - '#/paths/~1api~1v1~1catalog/get/responses'
    - '#/paths/~1api~1v1~1catalog~1refresh/post/responses'
  no-unused-components:
    - '#/components/schemas/ClusterEvent'
