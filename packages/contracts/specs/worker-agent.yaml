openapi: 3.1.0
info:
  title: Sardeenz Worker Agent API
  version: 0.1.0
  description: |
    Management API exposed by each worker agent (dev or production). The control
    plane calls these endpoints to start and stop runner processes on a worker.

    This contract formalizes the implicit API previously defined only by the
    `WorkerClient` class in the control plane. It also documents the Redis
    self-registration data shapes that workers write for discovery.

    ## Interface Areas

    1. **Runner management** — start and stop runner processes
    2. **Self-registration** — Redis key schemas for worker discovery (documented
       here as schemas, not as HTTP endpoints)

tags:
  - name: Runners
    description: Start and stop inference engine runner processes on this worker.
  - name: Logs
    description: Stream captured stdout/stderr from a running runner process.

paths:
  /runners:
    post:
      operationId: startRunner
      summary: Start a runner process
      description: |
        Instructs the worker to spawn a new runner process for the given model.
        The worker allocates a port, starts the runner, waits for the runner's
        health endpoint to respond, and returns the runner's endpoint.

        Multiple runners for the same model name may run concurrently on one
        worker (replicas) as long as each has a distinct `instanceId`.

        Returns `409` if a runner for the same `instanceId` is already running
        on this worker. Returns `503` if the worker has no capacity to start
        another runner.
      tags:
        - Runners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunnerRequest"
      responses:
        "201":
          description: Runner started successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartRunnerResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A runner for this instanceId is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Worker has no capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal worker error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runners/{runnerId}:
    get:
      operationId: getRunner
      summary: Check whether a runner is running
      description: |
        Liveness check for a single runner: returns `200` when a runner with
        the given `runnerId` is running on this worker, `404` when it is not
        (never started, already stopped, or exited and reaped).

        The control plane's reconciliation uses this to detect instances whose
        record still claims a worker/runner that no longer exists — e.g. after
        a worker restarts blank under the same `workerId` (issue #166): the
        heartbeat proves the *worker* is alive but its runner roster is gone.
        The probe is liveness-only — it makes no assertions about the runner's
        state or health, so a healthy runner is never flagged by it.
      tags:
        - Runners
      parameters:
        - name: runnerId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the runner to check.
      responses:
        "200":
          description: A runner with this id is running on this worker
        "404":
          description: No runner with this id is running on this worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: stopRunner
      summary: Stop a runner process
      description: |
        Stops the runner process identified by `runnerId`. The worker sends
        SIGTERM to the runner process, waits for it to exit (with a timeout
        followed by SIGKILL), and frees the associated resources.
      tags:
        - Runners
      parameters:
        - name: runnerId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the runner to stop.
      responses:
        "204":
          description: Runner stopped successfully
        "404":
          description: Runner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal worker error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runners/{runnerId}/logs:
    get:
      operationId: streamRunnerLogs
      summary: Stream a runner's captured logs
      description: |
        Server-Sent Events (SSE) endpoint that streams the captured
        stdout/stderr of a runner process. The control plane proxies this to
        the dashboard so operators can watch model startup (e.g. vLLM weight
        loading) in real time.

        On connect, the worker first replays the runner's buffered log lines
        (a bounded ring buffer, oldest surviving line first), then streams new
        lines live as the process emits them.

        Event frames:
        - `log` — a single captured line; `data` is a `RunnerLogLine` JSON object.
        - `end` — the runner process has exited; the stream will close.

        A `: ping` comment is sent every 30 seconds to keep the connection
        alive. Returns `404` if no runner with the given id exists on this
        worker.
      tags:
        - Logs
      parameters:
        - name: runnerId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the runner whose logs to stream.
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunnerLogLine"
        "404":
          description: Runner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal worker error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runners/by-model/{modelName}/logs:
    get:
      operationId: streamRunnerLogsByModel
      summary: Stream a runner's captured logs, addressed by model name
      description: |
        Same SSE stream as `GET /runners/{runnerId}/logs`, but addressed by the
        model name instead of the runner id.

        This is what the control plane uses to watch a **cold-starting** runner:
        it learns the `runnerId` only once its blocking `POST /runners` call
        returns (after the runner is healthy), which is too late to stream
        startup. The worker knows the `model → runner` mapping the instant the
        start command is received, so keying by model name makes a runner's logs
        addressable throughout cold-start.

        With replicas, more than one runner may serve the same model name on
        this worker — this endpoint returns the **most-recently-started**
        runner for the model; use `GET /runners/by-instance/{instanceId}/logs`
        to address a specific replica unambiguously.

        Returns `404` until the worker has actually received the start command
        for this model (the control plane retries).
      tags:
        - Logs
      parameters:
        - name: modelName
          in: path
          required: true
          schema:
            type: string
          description: Name of the model whose runner logs to stream.
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunnerLogLine"
        "404":
          description: No runner for this model (not started yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal worker error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runners/by-instance/{instanceId}/logs:
    get:
      operationId: streamRunnerLogsByInstance
      summary: Stream a runner's captured logs, addressed by instance id
      description: |
        Same SSE stream as `GET /runners/{runnerId}/logs`, but addressed by
        the control-plane-assigned `instanceId` instead of the worker-assigned
        `runnerId`.

        Unambiguous even when multiple runners serve the same model name on
        this worker (replicas): unlike `GET /runners/by-model/{modelName}/logs`,
        which resolves to the most-recently-started runner, this always
        targets the one instance requested. The control plane mints
        `instanceId` before calling `POST /runners`, so it is addressable
        throughout cold-start, before the worker returns a `runnerId`.

        Returns `404` until the worker has actually received the start command
        for this instance (the control plane retries).
      tags:
        - Logs
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
          description: Instance identifier whose runner logs to stream.
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunnerLogLine"
        "404":
          description: No runner for this instance (not started yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal worker error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # -------------------------------------------------------------------------
    # Runner management
    # -------------------------------------------------------------------------

    StartRunnerRequest:
      type: object
      description: |
        Request to start a runner process for a model. The fields mirror the
        placement decision made by the control plane.
      required:
        - modelName
        - runnerType
        - modelPath
        - requiredMemory
        - tensorParallel
        - devices
      properties:
        modelName:
          type: string
          description: Configuration name of the model to serve (routing key).
        servedModelName:
          type: string
          pattern: '^[A-Za-z0-9._/-]{1,200}$'
          maxLength: 200
          description: |
            Optional engine-reported model identity (ADR-020). When set and
            different from modelName, the launcher emits --served-model-name
            with both names (servedModelName first, then modelName). When
            absent, the launcher uses modelName alone (previous behavior).
            The stub launcher treats it as informational, like modelPath.
        runnerType:
          type: string
          description: |
            Runner type identifier (e.g., "vllm", "triton"). Determines which
            engine binary to launch.
        instanceId:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Control-plane-assigned instance identity; disambiguates replicas
            of one model on one worker. Optional/back-compat: when absent the
            worker generates one.
        runtimeModule:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: |
            Runtime module the worker must exec to serve this model, as
            `<engine>-<version>` (e.g., "vllm-0.21"). The production
            (Apptainer) worker resolves it to `/modules/<runtimeModule>.sif`
            by convention and `apptainer exec`s that signed SIF.

            Optional and back-compat: the dev-worker stub launcher ignores it
            (it forks an in-process stub regardless of module). When absent,
            the Apptainer launcher falls back to
            `<runnerType>-<engineConfig.version>` if available, otherwise
            errors — a production start must be able to resolve a SIF.
        modelPath:
          type: string
          description: |
            Path to the model weights. In production this is typically a shared
            filesystem path (CephFS). In dev mode, this is informational only.
        requiredMemory:
          type: integer
          format: int64
          minimum: 0
          description: |
            Total device memory required by this model in bytes. Used by the
            worker to validate capacity and update memory reports.
        deviceType:
          type: string
          description: |
            Preferred device type (e.g., "CUDA", "ROCM", "CPU"). Optional —
            the placement pipeline has already selected a compatible worker.
        tensorParallel:
          type: integer
          minimum: 1
          description: |
            Number of devices to use for tensor parallelism. Must not exceed
            the number of entries in `devices`.
        engineConfig:
          type: object
          deprecated: true
          description: |
            DEPRECATED — see engineArgs. Engine-specific configuration passed
            through to the runner process. The worker forwards it as-is.
          additionalProperties: true
        engineArgs:
          type: array
          items:
            type: string
          description: |
            Ordered CLI tokens the worker appends verbatim to the engine argv
            after the shim's `--` separator. Never shell-interpreted.
        entrypoint:
          type: array
          items:
            type: string
          description: |
            Optional verbatim argv the worker execs inside the SIF to launch
            this runner's management shim, from the runner's catalog metadata. When present,
            the Apptainer launcher uses it in place of its global
            SARDEENZ_RUNNER_ENTRYPOINT; when absent, the global default is used. Never
            shell-interpreted. The dev-worker stub launcher ignores it (it forks a fixed
            in-process stub), exactly as it ignores runtimeModule.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceAssignment"
          minItems: 1
          description: |
            Devices assigned to this runner by the placement pipeline. Each
            entry specifies a device index and type on this worker.

    DeviceAssignment:
      type: object
      description: A device assigned to a runner.
      required:
        - deviceIndex
        - deviceType
      properties:
        deviceIndex:
          type: integer
          minimum: 0
          description: Zero-based device index on this worker.
        deviceType:
          $ref: "engine-runner.yaml#/components/schemas/DeviceType"

    RunnerLogLine:
      type: object
      description: |
        A single captured line of runner output, streamed as the `data` of a
        `log` SSE frame from `GET /runners/{runnerId}/logs`.
      required:
        - ts
        - stream
        - content
      properties:
        ts:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the worker captured the line.
        stream:
          type: string
          enum:
            - stdout
            - stderr
          description: Which standard stream the line was captured from.
        content:
          type: string
          description: The captured log line (newline stripped).

    StartRunnerResponse:
      type: object
      description: Response after a runner has been started successfully.
      required:
        - runnerId
        - host
        - port
      properties:
        runnerId:
          type: string
          description: Unique identifier for the started runner.
        host:
          type: string
          description: Hostname or IP where the runner is listening.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            Management port where the runner's runner-contract API is listening
            (`/health`, `/progress`, `/memory-report`, `/sleep`, `/wake`, …).
            The control plane uses this port for lifecycle and health checks.
        enginePort:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            Port where the runner serves OpenAI-compatible inference traffic
            (`/v1/*`). Some runners (e.g. vLLM) run the engine's OpenAI server on
            a port distinct from the management port; the control plane registers
            this port as the model's routing endpoint so the proxy forwards
            inference here. When omitted, inference is served on `port`.

    # -------------------------------------------------------------------------
    # Self-registration schemas (Redis data, not HTTP payloads)
    # -------------------------------------------------------------------------

    WorkerInfo:
      type: object
      description: |
        Worker registration data pushed to Redis at
        `{prefix}:workers:{workerId}:info`. The control plane discovers
        workers by scanning for these keys.
      required:
        - capabilities
        - devices
        - managementUrl
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/WorkerCapability"
          minItems: 1
          description: Runner capabilities available on this worker.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/WorkerDeviceInfo"
          description: Compute devices available on this worker.
        managementUrl:
          type: string
          format: uri
          description: |
            HTTP URL where the worker's management API is listening
            (e.g., "http://10.244.1.5:9100"). Must be an address the control
            plane can actually reach — never "localhost" outside single-host
            dev setups, since in-cluster the control plane runs in a
            different pod. The control plane uses this to send start/stop
            runner commands and rejects workers that register without it.

    WorkerCapability:
      type: object
      description: Capability of a runner type available on this worker.
      required:
        - runnerType
        - engineName
        - supportedModelTypes
        - supportedDeviceTypes
        - supportedSleepLevels
      properties:
        runnerType:
          type: string
          description: Runner type identifier (e.g., "vllm", "triton").
        engineName:
          type: string
          description: Human-readable engine name.
        supportedModelTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/ModelType"
          description: Workload types this runner supports.
        supportedDeviceTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/DeviceType"
          description: Device types this runner supports.
        supportedSleepLevels:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/SleepLevel"
          description: Sleep levels this runner supports.
        engineVersion:
          type: string
          description: Version of the inference engine (e.g., "0.19.1").
        maxTensorParallelism:
          type: integer
          minimum: 1
          default: 1
          description: |
            Maximum number of devices this runner can span for tensor
            parallelism.
        kvCacheElasticSharing:
          type: boolean
          default: false
          description: |
            True when the runner supports elastic, reclaimable GPU-memory
            sharing across co-located runners on one device.
        features:
          type: object
          additionalProperties: true
          description: |
            Passthrough of engine-specific feature flags from the runner's
            capability declaration. Informational only.

    WorkerDeviceInfo:
      type: object
      description: A compute device on the worker.
      required:
        - deviceIndex
        - deviceType
        - memoryTotalBytes
      properties:
        deviceIndex:
          type: integer
          minimum: 0
          description: Zero-based device index.
        deviceType:
          $ref: "engine-runner.yaml#/components/schemas/DeviceType"
        memoryTotalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total device memory in bytes.

    WorkerMemoryReport:
      type: object
      description: |
        Per-device memory usage pushed to Redis at
        `{prefix}:workers:{workerId}:memory`. Updated whenever runners
        start, stop, sleep, or wake.
      required:
        - devices
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/WorkerDeviceMemory"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceMemoryMeasurement"
          description: |
            Measured per-instance device memory, attributed by mapping the
            device's process list (NVML) to the runner processes the worker
            spawned. On hosts without NVML (stub mode / CPU-only) the worker
            simulates the entries from its runner allocation ledger so
            per-model views behave identically in dev.
        reportedAt:
          type: string
          format: date-time
          description: |
            ISO-8601 timestamp of when the worker generated this report. Used
            by the control plane to determine staleness. When absent, the
            control plane falls back to the time it read the report.

    WorkerDeviceMemory:
      type: object
      description: Memory usage for a single device on the worker.
      required:
        - deviceIndex
        - deviceType
        - memoryUsedBytes
        - memoryTotalBytes
      properties:
        deviceIndex:
          type: integer
          minimum: 0
        deviceType:
          $ref: "engine-runner.yaml#/components/schemas/DeviceType"
        memoryUsedBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Measured device memory in use, in bytes, read from NVML
            (`nvmlDeviceGetMemoryInfo`, total − free — includes memory
            consumed by processes outside Sardeenz's control and the
            driver-reserved region). On hosts without NVML (stub mode /
            CPU-only), the worker simulates this figure from its runner
            allocation ledger so downstream views behave identically.
        memoryTotalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total device capacity in bytes.
        deviceName:
          type: string
          description: |
            Device product name from NVML (e.g. "NVIDIA GeForce RTX 4070
            Ti"). Absent when the worker cannot query it.
        utilizationPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            GPU utilization percentage from NVML at report time. Absent
            when unavailable.
        temperatureC:
          type: integer
          description: |
            GPU temperature in degrees Celsius from NVML at report time.
            Absent when unavailable.

    InstanceMemoryMeasurement:
      type: object
      description: |
        Measured device memory attributed to one runner instance on one
        device, from the device's NVML process list. Under kvcached elastic
        sharing the pooled allocation is attributed to the process that owns
        it, so co-located instances' figures are honest per-process numbers,
        not a split of the shared pool.
      required:
        - instanceId
        - modelName
        - deviceIndex
        - memoryUsedBytes
      properties:
        instanceId:
          type: string
          description: Control-plane instance identifier (`inst-<hex>`).
        modelName:
          type: string
          description: Configuration model name the instance belongs to.
        deviceIndex:
          type: integer
          minimum: 0
          description: Zero-based global device index.
        memoryUsedBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Measured bytes used by this instance's process tree on this
            device (stub-simulated on hosts without NVML).

    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      description: Error response returned on failure.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
        details:
          type: object
          description: Additional error context.
          additionalProperties: true
