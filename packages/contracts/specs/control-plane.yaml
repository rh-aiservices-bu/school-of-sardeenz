          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # -------------------------------------------------------------------------
    # Enums
    # -------------------------------------------------------------------------

    ModelLifecycleState:
      type: string
      description: |
        Lifecycle state of a model as managed by the control plane. This is
        a superset of the proxy-facing `ModelState` — it includes states
        that are only relevant to the control plane's orchestration logic.

        - `PENDING` — deployment accepted, placement pipeline not yet started
        - `STARTING` — runner is starting up, loading model weights
        - `ACTIVE` — model is loaded and serving inference
        - `DRAINING` — model is being drained before sleep or shutdown
        - `SLEEPING` — model weights offloaded, runner idle
        - `STOPPING` — runner is being stopped
        - `STOPPED` — configured but not running: no runner exists. The model
          record is retained and can be started again or deleted. This value is
          synthesized by the read routes for records with no runtime state.
        - `ERROR` — unrecoverable error, requires operator intervention
      enum:
        - PENDING
        - STARTING
        - ACTIVE
        - DRAINING
        - SLEEPING
        - STOPPING
        - STOPPED
        - ERROR

    WorkerStatus:
      type: string
      description: |
        Health status of a worker as determined by heartbeat monitoring.

        - `ONLINE` — worker heartbeat is current
        - `DEGRADED` — worker heartbeat is late but within grace period
        - `OFFLINE` — worker heartbeat has expired
      enum:
        - ONLINE
        - DEGRADED
        - OFFLINE

    ClusterEventType:
      type: string
      description: |
        Type of cluster event emitted on the SSE stream.
      enum:
        - MODEL_STATE_CHANGED
        - MODEL_DEPLOYED
        - MODEL_REMOVED
        - WORKER_JOINED
        - WORKER_LEFT
        - WORKER_MEMORY_UPDATED
        - EVICTION_TRIGGERED
        - PLACEMENT_COMPLETED
        - NOTIFICATION
        - CATALOG_REFRESHED
        - CATALOG_IMPORT_STARTED
        - CATALOG_IMPORT_PROGRESS
        - CATALOG_IMPORT_COMPLETED
        - CATALOG_IMPORT_FAILED
        - CATALOG_MODULE_REMOVED

    NotificationVariant:
      type: string
      description: |
        Visual severity variant for a notification.
      enum:
        - success
        - warning
        - danger
        - info

    NotificationSourceType:
      type: string
      description: |
        The origin type of a notification.
      enum:
        - model
        - worker
        - system

    # -------------------------------------------------------------------------
    # Models — Requests / Responses
    # -------------------------------------------------------------------------

    ModelDeploymentRequest:
      type: object
      description: |
        Request to deploy a new model. The control plane uses this to run
        the placement pipeline and start a runner.
      required:
        - modelName
        - runnerType
        - modelPath
        - requiredMemory
      properties:
        modelName:
          type: string
          description: |
            Configuration name used as the routing key. Must be unique across
            the cluster. This is what clients specify in the `model` field of
            OpenAI API requests. The engine also registers under this name so
            forwarded requests resolve (see servedModelName).
          pattern: '^[A-Za-z0-9._/-]{1,200}$'
          maxLength: 200
          examples:
            - "meta-llama/Llama-3.1-8B-Instruct"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Optional human-friendly label for this configuration, shown in the
            dashboard only (e.g. "Qwen test 1"). Free-form printable text. The
            server trims surrounding whitespace and measures the 1–200 length
            AFTER trimming; the trimmed value is what gets stored. NOT unique, NOT a routing
            key, never sent to workers/runners, never enters Redis or the
            routing map. Falls back to modelName in the UI when unset. No
            pattern constraint — unlike modelName/servedModelName it never
            reaches argv.
          examples:
            - "Qwen test 1"
        servedModelName:
          type: string
          pattern: '^[A-Za-z0-9._/-]{1,200}$'
          maxLength: 200
          description: |
            Optional model identity the engine reports in responses and
            metrics (ADR-020). When set and different from modelName, the
            launcher registers both names with the engine (servedModelName
            first, then modelName) so the engine reports the served name while
            still accepting requests that carry the configuration name.
            Defaults to modelName when absent. Not unique — multiple
            configurations may share one servedModelName.
          examples:
            - "meta-llama/Llama-3.1-8B-Instruct"
        runnerType:
          type: string
          description: |
            Required runner type. Must match a registered runner type in the
            worker pool (e.g., `vllm`, `triton`, `mlserver`).
          examples:
            - "vllm"
        modelPath:
          type: string
          description: |
            Path to model weights on shared storage (CephFS/NFS). Runners
            load weights from this path.
          examples:
            - "/models/meta-llama/Llama-3.1-8B-Instruct"
        requiredMemory:
          type: integer
          format: int64
          minimum: 0
          description: |
            Estimated device memory requirement in bytes. Used by the
            placement pipeline for capacity filtering.
          examples:
            - 17179869184
        deviceType:
          type: string
          description: |
            Required device type. If not specified, any compatible device
            type is accepted.
          examples:
            - "CUDA"
        tensorParallel:
          type: integer
          minimum: 1
          default: 1
          description: |
            Tensor parallelism degree. The model will be split across this
            many devices on a single worker.
        engineConfig:
          type: object
          deprecated: true
          description: |
            DEPRECATED — use engineArgs for engine parameters and runtimeModule
            for version selection. Retained for pre-existing rows; still stored
            and forwarded unchanged. Removal tracked in #15.
            Engine-specific configuration passed through to the runner.
            The control plane does not interpret this — it is stored in
            PostgreSQL and forwarded when starting the runner.
          additionalProperties: true
        engineArgs:
          type: array
          items:
            type: string
          description: |
            Ordered CLI tokens passed verbatim to the engine, appended after the
            runner shim's `--` separator (e.g.
            ["--max-model-len=8192", "--enable-prefix-caching"]). Never
            shell-interpreted — delivered as a spawn argv array. Flags the
            platform controls (--port, --host, --model, --served-model-name,
            --tensor-parallel-size, --engine-port) are reserved and rejected at
            deploy time.
        runtimeModule:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: |
            Runtime module the worker execs to serve this model, as
            `<engine>-<version>` (e.g., "vllm-0.21"). The control plane
            stores it and forwards it to the worker's `StartRunnerRequest`;
            the production (Apptainer) worker resolves it to
            `/modules/<runtimeModule>.sif`. Optional: when omitted the worker
            falls back to `<runnerType>-<engineConfig.version>`. The stub
            launcher ignores it.
          examples:
            - "vllm-0.21"
        pinned:
          type: boolean
          default: false
          description: |
            If true, the model cannot be evicted by the LRU eviction
            engine. It must be explicitly stopped by an operator.

    ModelDeploymentResponse:
      type: object
      description: |
        Response after a deployment request is accepted. The model is now
        in `PENDING` state.
      required:
        - modelName
        - state
      properties:
        modelName:
          type: string
          description: The deployed model name.
        instanceId:
          type: string
          description: The identifier of the first instance created by this deployment.
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        message:
          type: string
          description: Human-readable status message.

    ModelActionResponse:
      type: object
      description: |
        Response for model lifecycle actions (stop, start, sleep, wake, delete)
        and their instance-scoped variants.
      required:
        - modelName
        - state
      properties:
        modelName:
          type: string
          description: The affected model name.
        instanceId:
          type: string
          description: |
            The affected instance identifier. Present for instance-scoped
            operations (`POST .../instances`, `DELETE .../instances/{id}`,
            `POST .../instances/{id}/sleep`, `.../wake`); absent for
            model-level operations that act on every instance.
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        previousState:
          $ref: "#/components/schemas/ModelLifecycleState"
        message:
          type: string
          description: Human-readable status message.

    # -------------------------------------------------------------------------
    # Models — Info / Detail
    # -------------------------------------------------------------------------

    ModelInfo:
      type: object
      description: |
        Summary information for a model in the list view. A model may have
        zero or more instances (replicas); `state` is the **aggregate**
        state derived from all of its instances, by precedence: `ACTIVE` >
        `STARTING` > `DRAINING` > `SLEEPING` > `PENDING` > `STOPPING` >
        `ERROR`. A model with zero instances is `STOPPED`. This means a
        model reports `ACTIVE` as soon as at least one instance is healthy,
        even if another instance of the same model is in `ERROR`.
      required:
        - modelName
        - state
        - runnerType
        - instanceCount
        - createdAt
      properties:
        modelName:
          type: string
          description: Configuration name (routing key).
        displayName:
          type: string
          description: |
            Optional human-friendly label (dashboard presentation only).
            Absent when unset; the UI falls back to modelName.
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        runnerType:
          type: string
          description: Runner type serving this model.
        instanceCount:
          type: integer
          minimum: 0
          description: Number of instances (replicas) currently deployed for this model.
        workerId:
          type: string
          description: |
            Worker where the model is deployed. Populated only when
            `instanceCount == 1` (unambiguous); use
            `GET /api/v1/models/{modelName}` for the per-instance breakdown
            when there are multiple instances.
        requiredMemory:
          type: integer
          format: int64
          description: |
            Configured device memory estimate in bytes. An indicator used
            only for initial placement — it has no meaning once the model
            is loaded (see `currentMemory` for actual consumption).
        currentMemory:
          type: integer
          format: int64
          description: |
            Measured device memory consumption in bytes, summed across the
            model's instances from the worker's last NVML memory report.
            Absent when no instance has a measurement (model not running,
            or the worker cannot measure).
        lastInferenceAt:
          type: string
          format: date-time
          description: |
            Timestamp of the last inference request. Used for LRU eviction
            ordering. Null if the model has never served inference.
        pinned:
          type: boolean
          description: Whether the model is pinned (non-evictable).
        createdAt:
          type: string
          format: date-time
          description: When the model was deployed.

    InstanceDetail:
      type: object
      description: |
        A single instance (replica) of a model — one runner process on one
        worker, with its own lifecycle state, placement, and endpoint.
      required:
        - instanceId
        - state
        - createdAt
      properties:
        instanceId:
          type: string
          description: Instance identifier (`inst-<hex>`), minted by the control plane.
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        workerId:
          type: string
          description: Worker this instance is placed on.
        deviceIndices:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            Zero-based indices of the devices this instance is placed on.
            Populated when the instance has an active placement.
        runnerEndpoint:
          type: object
          description: Runner endpoint details (host, port).
          properties:
            host:
              type: string
              description: Runner hostname or IP.
            port:
              type: integer
              description: Runner port.
        currentMemory:
          type: integer
          format: int64
          description: |
            Measured device memory consumption in bytes for this instance,
            from the worker's last NVML memory report. Absent when the
            instance has no measurement.
        progress:
          type: object
          description: |
            Loading progress when the instance is in `STARTING` state.
          properties:
            phase:
              type: string
              description: Current loading phase.
            percentComplete:
              type: integer
              minimum: 0
              maximum: 100
              description: Overall loading completion percentage.
            message:
              type: string
              description: Human-readable progress message.
            estimatedRemainingSeconds:
              type: integer
              minimum: 0
              description: Estimated seconds until loading completes.
        stateChangedAt:
          type: string
          format: date-time
          description: When this instance last changed state.
        errorMessage:
          type: string
          description: Error details when this instance is in `ERROR` state.
        createdAt:
          type: string
          format: date-time
          description: When this instance was created.

    MoveModelInstanceRequest:
      type: object
      required:
        - targetWorkerId
        - targetDeviceIndices
      properties:
        targetWorkerId:
          type: string
          minLength: 1
          description: Worker that must host the replacement instance.
        targetDeviceIndices:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 0
          description: Exact zero-based device indices for the replacement instance.

    MoveModelInstanceResponse:
      type: object
      required:
        - modelName
        - sourceInstanceId
        - replacementInstanceId
      properties:
        modelName:
          type: string
        sourceInstanceId:
          type: string
        replacementInstanceId:
          type: string

    ModelDetail:
      type: object
      description: |
        Detailed information about a single model including deployment
        configuration and every instance (replica) currently deployed for
        it. `state` is the aggregate across `instances` (see `ModelInfo`).
      required:
        - modelName
        - state
        - runnerType
        - modelPath
        - requiredMemory
        - instances
        - createdAt
        - updatedAt
      properties:
        modelName:
          type: string
          description: Configuration name (routing key).
        displayName:
          type: string
          description: |
            Optional human-friendly label (dashboard presentation only).
            Absent when unset; the UI falls back to modelName.
        servedModelName:
          type: string
          description: |
            Engine-reported model identity, when explicitly set (ADR-020).
            Absent means the configuration name is used (default behavior).
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        runnerType:
          type: string
          description: Runner type serving this model.
        modelPath:
          type: string
          description: Path to model weights on shared storage.
        requiredMemory:
          type: integer
          format: int64
          description: |
            Configured device memory estimate in bytes. An indicator used
            only for initial placement — it has no meaning once the model
            is loaded (see `currentMemory` for actual consumption).
        deviceType:
          type: string
          description: Required device type.
        tensorParallel:
          type: integer
          description: Tensor parallelism degree.
        engineConfig:
          type: object
          deprecated: true
          description: Engine-specific configuration (deprecated — see engineArgs).
          additionalProperties: true
        engineArgs:
          type: array
          items:
            type: string
          description: Ordered CLI tokens passed verbatim to the engine.
        runtimeModule:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: |
            Runtime module the worker execs (`<engine>-<version>`, e.g.
            "vllm-0.21"), resolved to `/modules/<runtimeModule>.sif`.
        pinned:
          type: boolean
          description: Whether the model is pinned (non-evictable).
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceDetail"
          description: |
            Every instance (replica) currently deployed for this model. May
            be empty (a stopped model with a stored configuration record).
        lastInferenceAt:
          type: string
          format: date-time
          description: |
            Timestamp of the last inference request. Tracked per logical
            model, not per instance — a hot model's recency reflects
            inference against any of its replicas.
        createdAt:
          type: string
          format: date-time
          description: When the model was deployed.
        updatedAt:
          type: string
          format: date-time
          description: When the model configuration was last updated.

    # -------------------------------------------------------------------------
    # Workers
    # -------------------------------------------------------------------------

    WorkerInfo:
      type: object
      description: |
        Summary information for a worker in the list view.
      required:
        - workerId
        - status
        - devices
      properties:
        workerId:
          type: string
          description: Unique worker identifier.
        status:
          $ref: "#/components/schemas/WorkerStatus"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInfo"
          description: Compute devices available on this worker.
        modelCount:
          type: integer
          minimum: 0
          description: Number of models currently deployed on this worker.
        runnerCapabilities:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRunnerCapability"
          description: Runner types available on this worker.
        lastHeartbeatAt:
          type: string
          format: date-time
          description: Timestamp of the last heartbeat from this worker.

    WorkerDetail:
      type: object
      description: |
        Detailed information about a specific worker including per-device
        memory breakdown and running models.
      required:
        - workerId
        - status
        - devices
        - models
      properties:
        workerId:
          type: string
          description: Unique worker identifier.
        status:
          $ref: "#/components/schemas/WorkerStatus"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInfo"
          description: Compute devices with detailed memory breakdown.
        models:
          type: array
          items:
            $ref: "#/components/schemas/WorkerModelInfo"
          description: Models currently deployed on this worker.
        runnerCapabilities:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRunnerCapability"
          description: Runner types available on this worker.
        lastHeartbeatAt:
          type: string
          format: date-time
          description: Timestamp of the last heartbeat from this worker.
        joinedAt:
          type: string
          format: date-time
          description: When this worker joined the pool.

    DeviceInfo:
      type: object
      description: |
        Information about a single compute device on a worker.
      required:
        - deviceIndex
        - deviceType
        - memoryTotalBytes
        - memoryUsedBytes
        - memoryAvailableBytes
      properties:
        deviceIndex:
          type: integer
          minimum: 0
          description: Zero-based device index.
        deviceType:
          type: string
          description: Device type (CUDA, ROCM, CPU, OTHER).
        memoryTotalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total device memory capacity in bytes.
        memoryUsedBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Measured device memory in use, in bytes, from the worker's NVML
            report (stub-simulated on hosts without NVML). Includes memory
            consumed by processes outside Sardeenz's control.
        memoryAvailableBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Device memory available for placing new models, in bytes
            (capacity minus measured usage, minus any in-flight placement
            hold for an instance still starting — holds are an internal
            scheduling detail and are not exposed as a field).
        deviceName:
          type: string
          description: |
            Device product name from NVML (e.g. "NVIDIA GeForce RTX 4070
            Ti"). Absent when the worker cannot query it.
        utilizationPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: GPU utilization percentage at report time. Absent when unavailable.
        temperatureC:
          type: integer
          description: GPU temperature in °C at report time. Absent when unavailable.
        kvCache:
          type: object
          description: |
            Measured state of the kvcached elastic KV-cache pool on this
            device (prealloc/used/free breakdown), relayed from the worker's
            memory report. Telemetry only — never feeds placement math.
            Absent when no kvcached pool is reported for this device; absent
            means absent, not zero.
          required:
            - totalBytes
            - usedBytes
            - preallocBytes
            - freeBytes
          properties:
            totalBytes:
              type: integer
              format: int64
              minimum: 0
              description: |
                Pool's reserved virtual capacity in bytes (the pool's initial
                limit; it does not change as the pool elastically resizes).
            usedBytes:
              type: integer
              format: int64
              minimum: 0
              description: |
                Bytes of physical device memory currently pinned by the
                pool's in-use KV blocks.
            preallocBytes:
              type: integer
              format: int64
              minimum: 0
              description: |
                Bytes of physical device memory pinned by the pool's
                preallocated (reserved) pages.
            freeBytes:
              type: integer
              format: int64
              minimum: 0
              description: |
                Virtual capacity not yet backed by physical memory
                (`totalBytes - usedBytes - preallocBytes`).

    WorkerModelInfo:
      type: object
      description: |
        Summary of a model instance running on a specific worker.
      required:
        - modelName
        - state
      properties:
        modelName:
          type: string
          description: Configuration model name.
        displayName:
          type: string
          description: Human-facing display name, when one is configured.
        instanceId:
          type: string
          description: Instance identifier (`inst-<hex>`) for click-through navigation.
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        memoryUsedBytes:
          type: integer
          format: int64
          description: |
            Measured device memory consumed by this instance, in bytes,
            from the worker's NVML process attribution (stub-simulated on
            hosts without NVML). Absent when no measurement is attributed
            yet (e.g. the instance is still starting).
        deviceIndices:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            Zero-based indices of the devices this model is placed on.
            For tensor-parallel models, contains one entry per device.
            Absent for models deployed before device-attribution tracking.

    WorkerRunnerCapability:
      type: object
      description: |
        Runner type available on a worker.
      required:
        - runnerType
        - engineName
        - supportedModelTypes
        - supportedDeviceTypes
      properties:
        runnerType:
          type: string
          description: Runner type identifier.
        engineName:
          type: string
          description: Human-readable engine name.
        supportedModelTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/ModelType"
          description: Workload types this runner can serve.
        supportedDeviceTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/DeviceType"
          description: Device types this runner can use.
        supportedSleepLevels:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/SleepLevel"
          description: Sleep levels supported by this runner.
        engineVersion:
          type: string
          description: Version of the inference engine (e.g., "0.19.1").
        maxTensorParallelism:
          type: integer
          minimum: 1
          default: 1
          description: |
            Maximum number of devices this runner can span for tensor
            parallelism.
        kvCacheElasticSharing:
          type: boolean
          default: false
          description: |
            True when the runner supports elastic, reclaimable GPU-memory
            sharing across co-located runners on one device.
        features:
          type: object
          additionalProperties: true
          description: |
            Passthrough of engine-specific feature flags from the runner's
            capability declaration. Informational only.

    # -------------------------------------------------------------------------
    # Cluster
    # -------------------------------------------------------------------------

    ClusterStatus:
      type: object
      description: |
        Aggregate cluster health and capacity.
      required:
        - isLeader
        - workerCount
        - modelCounts
        - memory
      properties:
        isLeader:
          type: boolean
          description: Whether this instance is the active leader.
        workerCount:
          type: integer
          minimum: 0
          description: Total number of registered workers.
        workersOnline:
          type: integer
          minimum: 0
          description: Number of workers with current heartbeat.
        modelCounts:
          type: object
          description: Model counts by lifecycle state.
          required:
            - total
          properties:
            total:
              type: integer
              minimum: 0
              description: Total number of models.
            active:
              type: integer
              minimum: 0
              description: Models in ACTIVE state.
            sleeping:
              type: integer
              minimum: 0
              description: Models in SLEEPING state.
            starting:
              type: integer
              minimum: 0
              description: Models in STARTING state.
            error:
              type: integer
              minimum: 0
              description: Models in ERROR state.
            other:
              type: integer
              minimum: 0
              description: Models in other states (PENDING, DRAINING, STOPPING).
        memory:
          $ref: "#/components/schemas/ClusterMemorySummary"

    ClusterMemorySummary:
      type: object
      description: |
        Aggregate device memory across the cluster.
      required:
        - totalBytes
        - usedBytes
        - availableBytes
      properties:
        totalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total device memory across all workers and devices.
        usedBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Measured device memory in use across all workers and devices,
            in bytes (per-device NVML measurements; stub-simulated on
            hosts without NVML).
        availableBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Device memory available for placement across all workers and
            devices (net of in-flight placement holds, which are internal
            and not exposed as a field).

    ClusterMemory:
      type: object
      description: |
        Per-worker, per-device memory breakdown for VRAM budget
        visualization.
      required:
        - workers
        - summary
      properties:
        workers:
          type: array
          items:
            type: object
            required:
              - workerId
              - devices
            properties:
              workerId:
                type: string
                description: Worker identifier.
              devices:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceInfo"
                description: Per-device memory breakdown.
              models:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerModelInfo"
                description: Models consuming memory on this worker.
        summary:
          $ref: "#/components/schemas/ClusterMemorySummary"

    # -------------------------------------------------------------------------
    # Runner catalog
    # -------------------------------------------------------------------------

    CatalogItemState:
      type: string
      description: |
        Import state of a catalog entry relative to the shared module store.

        - `NOT_IMPORTED` — the SIF is not on the module store
        - `IMPORTING` — an import (`apptainer pull`) is in flight
        - `IMPORTED` — the SIF is present and usable
        - `FAILED` — the last import attempt failed (see `error`)
      enum:
        - NOT_IMPORTED
        - IMPORTING
        - IMPORTED
        - FAILED

    CatalogEntry:
      type: object
      description: |
        A single runner published in the catalog. Mirrors the `runners.yaml`
        schema (see the repo-root sample).
      required:
        - id
        - title
        - description
        - runnerType
        - version
        - image
        - sifName
        - protocol
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Stable unique id for the entry.
        title:
          type: string
          description: Human-readable name shown in the catalog.
        description:
          type: string
          description: One-paragraph summary.
        engine:
          type: string
          description: Engine family (e.g. "vLLM", "Triton").
        runnerType:
          type: string
          description: Runner type identifier (matches the runner contract).
        version:
          type: string
          description: Engine/build version string.
        image:
          type: string
          description: ORAS reference to pull (e.g. "oras://quay.io/ns/repo:tag").
        sifName:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: |
            Module filename stem → `/modules/<sifName>.sif`; equals the
            `runtimeModule` the worker agent execs.
        protocol:
          type: string
          enum: [openai, oip]
          description: |
            Protocol family this runner speaks — the proxy path prefix under which
            its models are invoked. `openai` → `/openai/v1/...` (vLLM). `oip` →
            KServe V2 Open Inference Protocol `/oip/v2/...` (MLServer). REQUIRED.
            Must match a value of `Protocol` in proxy-control-plane.yaml; a value the
            running proxy does not advertise fails catalog import (forward-compat guard).
        tags:
          type: array
          items:
            type: string
          description: Optional free-form labels for filtering.
        minVRAMGiB:
          type: integer
          minimum: 0
          description: Optional minimum device memory hint (GiB).
        license:
          type: string
          description: Optional SPDX license id.
        icon:
          type: string
          description: Optional URL to an icon.
        supportedModelTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/ModelType"
          description: Optional workload types this runner can serve.
        supportedDeviceTypes:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/DeviceType"
          description: Optional device types this runner can use.
        supportedSleepLevels:
          type: array
          items:
            $ref: "engine-runner.yaml#/components/schemas/SleepLevel"
          description: Optional sleep levels supported by this runner.
        maxTensorParallelism:
          type: integer
          minimum: 1
          default: 1
          description: |
            Optional maximum number of devices this runner can span for
            tensor parallelism.
        kvCacheElasticSharing:
          type: boolean
          default: false
          description: |
            Optional flag indicating the runner supports elastic,
            reclaimable GPU-memory sharing across co-located runners on one
            device.
        features:
          type: object
          additionalProperties: true
          description: |
            Optional passthrough of engine-specific feature flags.
            Informational only.
        entrypoint:
          type: array
          items:
            type: string
          description: |
            Optional verbatim argv the worker execs inside the SIF to launch this
            runner's management shim (e.g. ["python3","-m","sardeenz_mlserver_runner"]).
            Never shell-interpreted. When absent, the worker falls back to its global
            SARDEENZ_RUNNER_ENTRYPOINT (default the vLLM shim). Mirrors the runners.yaml field.

    CatalogItemStatus:
      type: object
      description: The import state of one catalog entry.
      required:
        - id
        - state
      properties:
        id:
          type: string
          description: Catalog entry id.
        state:
          $ref: "#/components/schemas/CatalogItemState"
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
          description: Import progress (only while `IMPORTING`, best-effort).
        error:
          type: string
          description: Failure detail when `state` is `FAILED`.

    CatalogItem:
      type: object
      description: |
        A catalog entry merged with its current import state. `updateAvailable`
        is true when the entry is imported but the catalog advertises a
        different image/version than what is on the store.
      required:
        - entry
        - status
        - updateAvailable
      properties:
        entry:
          $ref: "#/components/schemas/CatalogEntry"
        status:
          $ref: "#/components/schemas/CatalogItemStatus"
        updateAvailable:
          type: boolean
          description: True when an imported entry has a newer catalog version.

    RunnerCatalogView:
      type: object
      description: |
        The catalog merged against the module store: catalog entries with their
        import state, plus any module-store SIFs not present in the catalog.
      required:
        - runners
        - unmanagedModules
      properties:
        source:
          type: string
          description: The catalog source (URL or local file path) that was loaded.
        fetchedAt:
          type: string
          format: date-time
          description: When the catalog was last fetched.
        runners:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
          description: Catalog entries merged with import state.
        unmanagedModules:
          type: array
          items:
            type: string
          description: |
            SIF filename stems present on the module store but not in the
            catalog (e.g. locally built or manually placed modules).
        invalidEntries:
          type: array
          description: |
            Catalog entries that failed validation and were excluded from `runners`
            (e.g. missing the required `protocol`). Surfaced so an out-of-date catalog
            does not silently present as "no runners". Rendered by the dashboard.
          items:
            type: object
            required: [reason]
            properties:
              id:
                type: string
                description: The entry's `id` if present, else omitted.
              reason:
                type: string
                description: Human-readable, actionable validation failure reason.

    # -------------------------------------------------------------------------
    # Weights
    # -------------------------------------------------------------------------

    WeightsEntry:
      type: object
      description: A subdirectory within the model-weights directory.
      required:
        - name
        - path
        - isModelDir
      properties:
        name:
          type: string
          description: The directory's own name (no path separators).
        path:
          type: string
          description: |
            Absolute path to the directory, usable directly as a model path
            (the weights root joined with the entry's relative location).
        isModelDir:
          type: boolean
          description: |
            True if the directory looks like it holds model weights (contains
            `config.json`, `*.safetensors`, `*.gguf`, `*.bin`, etc.).

    WeightsListing:
      type: object
      description: |
        A single-level listing of the model-weights directory, used by the
        dashboard's model-path folder picker.
      required:
        - root
        - path
        - relativePath
        - entries
      properties:
        root:
          type: string
          description: Absolute path of the weights root (`SARDEENZ_WEIGHTS_DIR`).
        path:
          type: string
          description: Absolute path of the directory that was listed.
        relativePath:
          type: string
          description: |
            Path of the listed directory relative to the root (empty string at
            the root). Use this as the `path` query when navigating.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WeightsEntry"
          description: Immediate subdirectories, sorted by name.

    # -------------------------------------------------------------------------
    # Events
    # -------------------------------------------------------------------------

    ClusterEvent:
      type: object
      description: |
        An event emitted on the SSE stream. The `type` field determines
        which data fields are populated.
      required:
        - type
        - timestamp
      properties:
        type:
          $ref: "#/components/schemas/ClusterEventType"
        timestamp:
          type: string
          format: date-time
          description: When the event occurred.
        modelName:
          type: string
          description: Affected model name (for model events).
        workerId:
          type: string
          description: Affected worker ID (for worker events).
        state:
          $ref: "#/components/schemas/ModelLifecycleState"
        previousState:
          $ref: "#/components/schemas/ModelLifecycleState"
        message:
          type: string
          description: Human-readable event description.
        data:
          type: object
          description: Event-specific data.
          additionalProperties: true

    RunnerLogLine:
      type: object
      description: |
        A single captured line of runner output, streamed as the `data` of a
        `log` SSE frame from `GET /api/v1/models/{modelName}/logs`. Mirrors the
        worker-agent `RunnerLogLine` schema (the control plane proxies these
        frames through verbatim).
      required:
        - ts
        - stream
        - content
      properties:
        ts:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the worker captured the line.
        stream:
          type: string
          enum:
            - stdout
            - stderr
          description: Which standard stream the line was captured from.
        content:
          type: string
          description: The captured log line (newline stripped).

    # -------------------------------------------------------------------------
    # Notifications
    # -------------------------------------------------------------------------

    NotificationSource:
      type: object
      description: |
        Links a notification to its origin entity.
      properties:
        type:
          $ref: "#/components/schemas/NotificationSourceType"
        name:
          type: string
          description: Model name or worker ID.

    Notification:
      type: object
      description: |
        A structured notification generated by the control plane in response
        to lifecycle events, worker changes, or system conditions.
      required:
        - id
        - title
        - variant
        - timestamp
        - isRead
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification identifier.
        title:
          type: string
          description: Short human-readable notification title.
        description:
          type: string
          description: Detailed notification body.
        variant:
          $ref: "#/components/schemas/NotificationVariant"
        timestamp:
          type: string
          format: date-time
          description: When the notification was created.
        isRead:
          type: boolean
          description: Whether the notification has been marked as read.
        source:
          $ref: "#/components/schemas/NotificationSource"

    NotificationList:
      type: object
      description: |
        Response for listing notifications.
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      description: Error response returned by any endpoint on failure.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code for programmatic handling.
        details:
          type: object
          description: Additional structured error details.
          additionalProperties: true
