openapi: 3.1.0
info:
  title: Sardeenz Control Plane API
  version: 0.1.4
  description: |
    Admin and orchestration API for the Sardeenz control plane. This is the
    single API surface consumed by both the admin dashboard backend and
    operators managing the cluster.

    ## Interface Areas

    1. **Model lifecycle management** — deploy, sleep, wake, stop models
    2. **Worker management** — list workers and their capabilities
    3. **Cluster state** — aggregate cluster health and capacity

    ## Conventions

    - Endpoint paths: `kebab-case`
    - Schema names: `PascalCase`
    - Field names: `camelCase`
    - Enum values: `SCREAMING_SNAKE_CASE`

tags:
  - name: Models
    description: |
      Model lifecycle management. Deploy, query, sleep, wake, and stop
      models across the worker pool.
  - name: Workers
    description: |
      Worker pool monitoring. List workers, query capabilities, and
      inspect per-device memory usage.
  - name: Cluster
    description: |
      Aggregate cluster state. Health, capacity, and summary statistics.
  - name: Notifications
    description: |
      Notification management. List, read, and clear notifications
      generated by lifecycle events and system conditions.
  - name: Weights
    description: |
      Browse the shared model-weights directory (`SARDEENZ_WEIGHTS_DIR`) to
      pick a model path when deploying.

paths:
  # ---------------------------------------------------------------------------
  # Models
  # ---------------------------------------------------------------------------

  /api/v1/models:
    post:
      operationId: deployModel
      summary: Deploy a new model
      description: |
        Submit a model deployment request. The control plane runs the
        placement pipeline to find a suitable worker, starts the runner,
        and tracks the model through its lifecycle.

        If no worker has sufficient capacity, the control plane triggers
        eviction of least-recently-used models before retrying placement.

        The response returns immediately with the deployment status. The
        model transitions through `PENDING` → `STARTING` → `ACTIVE`
        asynchronously. Monitor progress via the events stream or by
        polling `GET /api/v1/models/{modelName}`.

        Creates the logical model and its first instance. Returns `409` if
        a model with the same name already exists — to add another instance
        (replica) of a model that is already deployed, use
        `POST /api/v1/models/{modelName}/instances` instead.
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDeploymentRequest"
      responses:
        "202":
          description: |
            Deployment accepted. The model is now in `STARTING` state and
            the placement pipeline is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDeploymentResponse"
        "400":
          description: Invalid deployment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A model with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            Control plane cannot accept deployments (not leader, or
            required services unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listModels
      summary: List all models
      description: |
        Returns all models with their current lifecycle state and summary
        information. Combines runtime state from Redis with configuration
        from PostgreSQL.
      tags:
        - Models
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by lifecycle state
          schema:
            $ref: "#/components/schemas/ModelLifecycleState"
      responses:
        "200":
          description: Model list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - models
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelInfo"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}:
    get:
      operationId: getModel
      summary: Get model details
      description: |
        Returns detailed information about a specific model including its
        current lifecycle state, worker assignment, device memory usage,
        runner capabilities, and deployment configuration.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "200":
          description: Model details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDetail"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteModel
      summary: Stop and remove a model
      description: |
        Stops the model's runner **and removes its configuration record**. The
        control plane transitions the model through `DRAINING` → `STOPPING` →
        `STOPPED`, then removes it from the routing map and PostgreSQL.

        If the model is `SLEEPING`, it transitions directly to `STOPPING`. If it
        is `ACTIVE`, it drains first to allow in-flight requests to complete. If
        the model has no runtime state (already stopped, record only), the record
        is removed directly.

        Unlike `POST /api/v1/models/{modelName}/stop`, which keeps the record for a
        later restart, `DELETE` is permanent.

        Returns `202` immediately — the removal happens asynchronously.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Model removal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            An instance is in a transient state (PENDING, STARTING, DRAINING, or
            STOPPING), or another mutating operation is already in progress for
            the model (a delete, a stop, or an instance-scoped op). All use code
            `INVALID_STATE`; the transient-state body names the offending instance
            and its state, and the in-progress-operation body carries a
            `details.reason` (`delete-in-progress` / `stop-in-progress` /
            `instance-operation-in-progress` / `move-in-progress`) so a client can distinguish them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The control plane cannot accept the request (not leader)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/logs:
    get:
      operationId: streamModelLogs
      summary: Stream a model's runner logs
      description: |
        Server-Sent Events (SSE) endpoint that streams the captured
        stdout/stderr of the runner serving this model. The control plane
        resolves the model's worker and runner, then proxies the worker's
        `GET /runners/{runnerId}/logs` stream through to the caller. The
        dashboard uses this to show live model-startup logs (e.g. vLLM weight
        loading) in the deploy modal.

        Because deployment is asynchronous, the runner may not be placed yet
        when the caller connects. In that case the control plane keeps the SSE
        connection open (sending `: ping` keepalive comments) and begins
        streaming once the runner is available, rather than returning an error
        that a browser `EventSource` would treat as fatal.

        Event frames:
        - `log` — a single captured line; `data` is a `RunnerLogLine` JSON object.
        - `end` — the runner process has exited; the stream will close.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunnerLogLine"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/sleep:
    post:
      operationId: sleepModel
      summary: Put a model to sleep
      description: |
        Admin-initiated sleep. Transitions the model through `DRAINING` →
        `SLEEPING`. This is separate from eviction-triggered sleep — it's
        an explicit operator action.

        Only models in `ACTIVE` state can be put to sleep. Returns `409`
        for models in other states.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Sleep request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Model is not in a state that can be put to sleep, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/wake:
    post:
      operationId: wakeModel
      summary: Wake a sleeping model
      description: |
        Admin-initiated wake. Transitions the model from `SLEEPING` →
        `STARTING` → `ACTIVE`. This is separate from proxy-triggered wake
        — it's an explicit operator action.

        Only models in `SLEEPING` state can be woken. Models already in
        `STARTING` state return `202` idempotently.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Wake request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Model is not in a wakeable state, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/stop:
    post:
      operationId: stopModel
      summary: Stop a model but keep its record
      description: |
        Stops the model's runner while retaining its configuration record.
        The control plane drains in-flight requests (if `ACTIVE`), stops the
        runner, removes the model from the routing map, and clears its runtime
        state — but keeps the PostgreSQL record so the model can be started
        again later with `POST /api/v1/models/{modelName}/start`.

        This is distinct from `DELETE`, which also removes the record. Use Stop
        to park a configured model; use Delete to remove it entirely.

        Returns `202` immediately; the stop completes asynchronously.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Stop request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model not found or not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Model is already stopping, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            No worker has sufficient capacity even after eviction, or the
            control plane cannot accept the request (not leader)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/start:
    post:
      operationId: startModel
      summary: Start a previously stopped model
      description: |
        Starts a stopped model from its stored configuration. The control plane
        re-runs the placement pipeline using the configuration persisted in the
        model record (runner type, model path, required memory, device type,
        tensor parallelism, engine config, runtime module) — no request body is
        needed.

        Because placement re-runs, the model may be placed on a different worker
        than before: the record stores no worker affinity. This is intended.

        Valid only when the model has no runtime state (it is stopped). Returns
        `409` if the model is already running or transitioning, and `404` if no
        record exists. Returns `202` immediately; deployment proceeds
        asynchronously through `STARTING` → `ACTIVE` (or `PENDING` while capacity
        is reclaimed).
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Start request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "400":
          description: Invalid deployment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No model record exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Model already has runtime state (running or transitioning), or a
            delete is already in progress for the model. Both use code
            `INVALID_STATE`; an in-progress operation carries `details.reason`
            (`delete-in-progress` or `move-in-progress`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            No worker has sufficient capacity even after eviction, or the
            control plane cannot accept the request (not leader)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/instances:
    post:
      operationId: createModelInstance
      summary: Create an additional instance (replica) of an existing model
      description: |
        Create an additional instance (replica) of an existing model from its
        stored config. Unlike `POST /api/v1/models`, this never 409s on an
        already-deployed model — it is the way to add a second (or Nth)
        replica of a model that is already running, including a replica on
        the same worker as an existing one.

        The control plane re-runs the placement pipeline exactly as it does
        for `POST /api/v1/models/{modelName}/start`, but using a **freshly
        minted instance id** rather than replacing any existing instance.
        Both the new and any existing instances remain registered in the
        routing map and receive traffic.

        Returns `404` if no model record exists (deploy the model first via
        `POST /api/v1/models`).
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
      responses:
        "202":
          description: Instance creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: No model record exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            A delete is already in progress for the model — a new instance
            cannot be minted for a model whose teardown is backgrounding, or a move
            is in progress. Code `INVALID_STATE`, `details.reason: delete-in-progress`
            or `move-in-progress`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            No worker has sufficient capacity even after eviction, or the
            control plane cannot accept the request (not leader)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/instances/{instanceId}:
    delete:
      operationId: deleteModelInstance
      summary: Stop and remove a single instance (replica) of a model
      description: |
        Stops and removes exactly one instance of a model, leaving any other
        instances untouched and still serving. The routing map entry shrinks
        to the surviving endpoints — inference continues uninterrupted
        through them.

        This is the "stop old instance" step of a scripted move: deploy a
        new instance elsewhere, shift traffic (e.g. via the endpoint
        weight), then delete this one.

        The model's configuration record is unaffected — deleting the last
        instance leaves a model with zero instances (equivalent to what
        `POST /api/v1/models/{modelName}/stop` produces), not a deleted
        model. Use `DELETE /api/v1/models/{modelName}` to remove the model
        entirely.

        Returns `202` immediately — the removal happens asynchronously.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
        - name: instanceId
          in: path
          required: true
          description: The instance identifier (`inst-<hex>`)
          schema:
            type: string
      responses:
        "202":
          description: Instance removal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model or instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Instance is in a transient state (PENDING, STARTING, DRAINING, or STOPPING), a delete is already in progress, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The control plane cannot accept the request (not leader)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/instances/{instanceId}/move:
    post:
      operationId: moveModelInstance
      summary: Move an active model instance to an explicit worker and GPU set
      description: |
        Creates a replacement instance on the requested placement, waits for it to become
        active, then atomically removes traffic from and drains the source instance. Poll
        `GET /api/v1/models/{modelName}` after the `202` response to observe the replacement
        and source lifecycle states. Only one move per logical model may run at a time.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          schema:
            type: string
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveModelInstanceRequest"
      responses:
        "202":
          description: Move accepted; poll model detail for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveModelInstanceResponse"
        "400":
          description: Malformed target, nonexistent device, or source-equivalent placement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model, source instance, or target worker not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Source is not active or another mutating operation/move is in progress (`INVALID_STATE`, with `details.reason` for an in-progress move).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Corrupt active source endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Not leader or target cannot satisfy the fixed placement without eviction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/instances/{instanceId}/sleep:
    post:
      operationId: sleepModelInstance
      summary: Put a single instance (replica) of a model to sleep
      description: |
        Admin-initiated sleep, scoped to one instance. Transitions that
        instance through `DRAINING` → `SLEEPING`. Other instances of the
        same model are unaffected.

        Only instances in `ACTIVE` state can be put to sleep. Returns `409`
        for instances in other states.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
        - name: instanceId
          in: path
          required: true
          description: The instance identifier (`inst-<hex>`)
          schema:
            type: string
      responses:
        "202":
          description: Sleep request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model or instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Instance is not in a state that can be put to sleep, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/models/{modelName}/instances/{instanceId}/wake:
    post:
      operationId: wakeModelInstance
      summary: Wake a single sleeping instance (replica) of a model
      description: |
        Admin-initiated wake, scoped to one instance. Transitions that
        instance from `SLEEPING` → `STARTING` → `ACTIVE`. Other instances of
        the same model are unaffected.

        Only instances in `SLEEPING` state can be woken. Instances already
        in `STARTING` state return `202` idempotently.
      tags:
        - Models
      parameters:
        - name: modelName
          in: path
          required: true
          description: The model name (routing key)
          schema:
            type: string
        - name: instanceId
          in: path
          required: true
          description: The instance identifier (`inst-<hex>`)
          schema:
            type: string
      responses:
        "202":
          description: Wake request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "404":
          description: Model or instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Instance is not in a wakeable state, or a move is in progress (`details.reason: move-in-progress`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Workers
  # ---------------------------------------------------------------------------

  /api/v1/workers:
    get:
      operationId: listWorkers
      summary: List all workers
      description: |
        Returns all registered workers with their capabilities, running
        models, and aggregate memory usage.
      tags:
        - Workers
      responses:
        "200":
          description: Worker list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - workers
                properties:
                  workers:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerInfo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workers/{workerId}:
    get:
      operationId: getWorker
      summary: Get worker details
      description: |
        Returns detailed information about a specific worker including
        per-device memory breakdown, running runners, and capabilities.
      tags:
        - Workers
      parameters:
        - name: workerId
          in: path
          required: true
          description: The worker identifier
          schema:
            type: string
      responses:
        "200":
          description: Worker details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDetail"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Cluster
  # ---------------------------------------------------------------------------

  /api/v1/cluster/status:
    get:
      operationId: getClusterStatus
      summary: Get cluster status
      description: |
        Returns aggregate cluster state including total/used/free device
        memory, model counts by state, worker counts, and leader status.
      tags:
        - Cluster
      responses:
        "200":
          description: Cluster status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/cluster/memory:
    get:
      operationId: getClusterMemory
      summary: Get cluster memory breakdown
      description: |
        Returns per-worker, per-device memory breakdown across the entire
        cluster. Used by the dashboard for VRAM budget visualization.
      tags:
        - Cluster
      responses:
        "200":
          description: Cluster memory breakdown retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterMemory"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Runner catalog
  # ---------------------------------------------------------------------------

  /api/v1/catalog:
    get:
      operationId: listCatalog
      summary: List the runner catalog (merged with import state)
      description: |
        Returns the runner catalog loaded from `SARDEENZ_RUNNER_CATALOG_URL`
        (or a local file in dev), merged with the current contents of the
        shared module store so each entry carries its import state and whether
        a newer version is available. Also lists module-store SIFs that are not
        in the catalog (`unmanagedModules`).

        The control plane caches the catalog; use `POST /api/v1/catalog/refresh`
        to force a re-fetch.
      tags:
        - Catalog
      responses:
        "200":
          description: Catalog retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCatalogView"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Catalog source could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/catalog/refresh:
    post:
      operationId: refreshCatalog
      summary: Re-fetch the runner catalog from its source
      description: |
        Forces the control plane to re-fetch the catalog from its configured
        source and re-merge it against the module store. Returns the refreshed
        view.
      tags:
        - Catalog
      responses:
        "200":
          description: Catalog refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCatalogView"
        "502":
          description: Catalog source could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/catalog/{id}/import:
    post:
      operationId: importRunner
      summary: Import a catalog runner (pull its SIF onto the module store)
      description: |
        Starts an asynchronous import of the catalog entry `id`: the control
        plane pulls the entry's SIF (`apptainer pull <sifName>.sif oras://…`)
        onto the shared module store, verifies its signature, and publishes it
        atomically. Progress is reported on the SSE event stream
        (`CATALOG_IMPORT_*` events). Returns immediately with the item's
        current status.

        Idempotent while an import is in flight (returns the in-progress
        status). Re-importing an already-imported entry re-pulls it (used to
        apply an available update).
      tags:
        - Catalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Catalog entry id.
      responses:
        "202":
          description: Import accepted and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemStatus"
        "404":
          description: No catalog entry with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/catalog/{id}:
    delete:
      operationId: uninstallRunner
      summary: Uninstall an imported runner (delete its SIF)
      description: |
        Removes the imported SIF for catalog entry `id` from the module store.
        Rejected with `409` if a runner started from that module is currently
        running (in use).
      tags:
        - Catalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Catalog entry id.
      responses:
        "204":
          description: SIF removed successfully
        "404":
          description: No such catalog entry or the SIF is not imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The module is in use by a running runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Weights
  # ---------------------------------------------------------------------------

  /api/v1/weights:
    get:
      operationId: browseWeights
      summary: Browse the shared model-weights directory
      description: |
        Lists the immediate subdirectories of the model-weights directory
        (`SARDEENZ_WEIGHTS_DIR`) at the given relative `path`, so the dashboard
        can offer a folder picker for the model path. Directories that look
        like a model (they contain `config.json`, `*.safetensors`, `*.gguf`,
        etc.) are flagged with `isModelDir` and are directly selectable. The
        `path` query is resolved relative to the weights root and is rejected
        (`400`) if it escapes it. A missing weights root yields an empty
        listing rather than an error.
      tags:
        - Weights
      parameters:
        - name: path
          in: query
          required: false
          description: |
            Directory to list, relative to the weights root. Defaults to the
            root. Must not escape the root (no absolute paths or `..` traversal).
          schema:
            type: string
      responses:
        "200":
          description: Directory listing retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightsListing"
        "400":
          description: The requested path escapes the weights root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notifications
      description: |
        Returns stored notifications, newest first. Notifications are
        capped at 200 entries. Read state is tracked separately.
      tags:
        - Notifications
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of notifications to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of notifications to skip (for pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Notification list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: clearAllNotifications
      summary: Clear all notifications
      description: |
        Removes all stored notifications and resets read state.
      tags:
        - Notifications
      responses:
        "204":
          description: All notifications cleared
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark a notification as read
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notification marked as read
        "400":
          description: Invalid notification ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      tags:
        - Notifications
      responses:
        "204":
          description: All notifications marked as read
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal control plane error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/notifications/{id}:
    delete:
      operationId: removeNotification
      summary: Remove a single notification
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notification removed
        "400":
          description: Invalid notification ID
          content:
