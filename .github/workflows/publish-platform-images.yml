name: Publish platform images

run-name: Publish platform images :${{ inputs.tag }} from ${{ github.ref_name }}

# Supply chain (ADR-030): every build pushes to a staging tag (`<tag>-staging`), Trivy scans that
# digest (a fixed CRITICAL fails the run; CRITICAL-unfixed and HIGH go to GitHub code scanning) and
# only then is the digest signed keyless with cosign. The requested tag moves **last**, by digest
# (`docker buildx imagetools create`, a manifest copy that keeps the digest and its signature), so a
# rejected run never leaves it pointing at an unsigned image; the staging tag stays for inspection.
# Worker builds only FROM a worker-base whose signature this repository's publish workflows made on
# `dev`. The signature's trust anchor is THIS FILE'S identity:
#   https://github.com/rh-aiservices-bu/school-of-sardeenz/.github/workflows/publish-platform-images.yml@refs/heads/dev
# Renaming this file changes the verification identity documented in ADR-030.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: OCI tag applied to all five platform images
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: publish-platform-images-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  QUAY_NAMESPACE: rh-aiservices-bu

jobs:
  validate:
    name: Validate publishing parameters
    runs-on: ubuntu-latest
    steps:
      - name: Validate OCI tags
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Both the requested tag and the staging tag every push goes to (`<tag>-staging`) must be
          # valid OCI tags; the staging suffix can push a 128-character tag over the limit.
          for tag in "$IMAGE_TAG" "${IMAGE_TAG}-staging"; do
            if [[ ${#tag} -gt 128 ]]; then
              echo "Invalid OCI tag (longer than 128 characters): $tag" >&2
              exit 2
            fi
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid OCI tag: $tag" >&2
              exit 2
            fi
          done

  services:
    name: Publish ${{ matrix.role }}
    needs: validate
    permissions:
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: proxy
            context: ./proxy
            file: ./proxy/Dockerfile
            repository: sardeenz-proxy
          - role: control-plane
            context: .
            file: ./containers/control-plane/Dockerfile
            repository: sardeenz-control-plane
          - role: dashboard
            context: .
            file: ./containers/dashboard/Dockerfile
            repository: sardeenz-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay
        env:
          QUAY_ROBOT_SARDEENZ_USERNAME: ${{ secrets.QUAY_ROBOT_SARDEENZ_USERNAME }}
          QUAY_ROBOT_SARDEENZ_TOKEN: ${{ secrets.QUAY_ROBOT_SARDEENZ_TOKEN }}
        run: |
          : "${QUAY_ROBOT_SARDEENZ_USERNAME:?QUAY_ROBOT_SARDEENZ_USERNAME secret is required}"
          : "${QUAY_ROBOT_SARDEENZ_TOKEN:?QUAY_ROBOT_SARDEENZ_TOKEN secret is required}"
          printf '%s' "$QUAY_ROBOT_SARDEENZ_TOKEN" \
            | docker login "$REGISTRY" --username "$QUAY_ROBOT_SARDEENZ_USERNAME" --password-stdin

      - name: Build and push ${{ matrix.role }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}:${{ inputs.tag }}-staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.role }},ignore-error=true

      # Two scans, one gate: the report scan feeds code scanning, the gate scan blocks on a fixable
      # CRITICAL. Scan before sign: a rejected image must stay unsigned.
      - name: Scan ${{ matrix.role }} by digest — report CRITICAL + HIGH
        id: scan-report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action has no `platform` input; Trivy maps every CLI flag to TRIVY_<FLAG>,
          # so this is `trivy image --platform linux/amd64 …` (the pushed digest is an index).
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.role }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: 'false'
          exit-code: '0'
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Upload ${{ matrix.role }} vulnerability report
        if: always() && steps.scan-report.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-${{ matrix.role }}.sarif
          category: trivy-${{ matrix.role }}

      - name: Gate — fail on fixed CRITICAL vulnerabilities (${{ matrix.role }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Sign ${{ matrix.role }} by digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode legacy "$IMAGE"

      # Promote last, by digest: `imagetools create` copies the pushed manifest list into the
      # requested tag without rebuilding, so the digest — and therefore the signature over it — is
      # unchanged. Reaching this step means the scan gate passed and the digest is signed; a gate
      # failure never gets here, so the requested tag keeps pointing at the previous image and the
      # `<tag>-staging` tag stays behind for inspection.
      - name: Promote ${{ matrix.role }} to ${{ inputs.tag }}
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$REPOSITORY:$TAG" "$REPOSITORY@$DIGEST"

      - name: Log out of Quay
        if: always()
        run: docker logout "$REGISTRY" || true

  worker-base:
    name: Publish worker base
    needs: validate
    permissions:
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay
        env:
          QUAY_ROBOT_SARDEENZ_USERNAME: ${{ secrets.QUAY_ROBOT_SARDEENZ_USERNAME }}
          QUAY_ROBOT_SARDEENZ_TOKEN: ${{ secrets.QUAY_ROBOT_SARDEENZ_TOKEN }}
        run: |
          : "${QUAY_ROBOT_SARDEENZ_USERNAME:?QUAY_ROBOT_SARDEENZ_USERNAME secret is required}"
          : "${QUAY_ROBOT_SARDEENZ_TOKEN:?QUAY_ROBOT_SARDEENZ_TOKEN secret is required}"
          printf '%s' "$QUAY_ROBOT_SARDEENZ_TOKEN" \
            | docker login "$REGISTRY" --username "$QUAY_ROBOT_SARDEENZ_USERNAME" --password-stdin

      - name: Build and push worker base
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./containers/worker-base
          file: ./containers/worker-base/Containerfile
          tags: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base:${{ inputs.tag }}-staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-worker-base
          cache-to: type=gha,mode=max,scope=publish-worker-base,ignore-error=true

      # Two scans, one gate: the report scan feeds code scanning, the gate scan blocks on a fixable
      # CRITICAL. Scan before sign: a rejected image must stay unsigned.
      - name: Scan worker-base by digest — report CRITICAL + HIGH
        id: scan-report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action has no `platform` input; Trivy maps every CLI flag to TRIVY_<FLAG>,
          # so this is `trivy image --platform linux/amd64 …` (the pushed digest is an index).
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ steps.publish.outputs.digest }}
          format: sarif
          output: trivy-worker-base.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: 'false'
          exit-code: '0'
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Upload worker-base vulnerability report
        if: always() && steps.scan-report.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-worker-base.sarif
          category: trivy-worker-base

      - name: Gate — fail on fixed CRITICAL vulnerabilities (worker-base)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ steps.publish.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Sign worker-base by digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode legacy "$IMAGE"

      # Promote last, by digest — see the services job: `imagetools create` copies the manifest list,
      # so the digest and its signature are unchanged, and a gate failure never reaches this step.
      - name: Promote worker-base to ${{ inputs.tag }}
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$REPOSITORY:$TAG" "$REPOSITORY@$DIGEST"

      - name: Log out of Quay
        if: always()
        run: docker logout "$REGISTRY" || true

  worker:
    name: Publish worker
    needs: [validate, worker-base]
    permissions:
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay
        env:
          QUAY_ROBOT_SARDEENZ_USERNAME: ${{ secrets.QUAY_ROBOT_SARDEENZ_USERNAME }}
          QUAY_ROBOT_SARDEENZ_TOKEN: ${{ secrets.QUAY_ROBOT_SARDEENZ_TOKEN }}
        run: |
          : "${QUAY_ROBOT_SARDEENZ_USERNAME:?QUAY_ROBOT_SARDEENZ_USERNAME secret is required}"
          : "${QUAY_ROBOT_SARDEENZ_TOKEN:?QUAY_ROBOT_SARDEENZ_TOKEN secret is required}"
          printf '%s' "$QUAY_ROBOT_SARDEENZ_TOKEN" \
            | docker login "$REGISTRY" --username "$QUAY_ROBOT_SARDEENZ_USERNAME" --password-stdin

      # Pairing consumes only a worker-base that this repository's publish workflows signed from
      # `dev` — here the one the worker-base job signed in this same run. An unsigned or foreign base
      # aborts the build (fail-closed), so a compromised robot that moves the base tag cannot launder
      # it into a signed worker; a base published before #266 carries no signature, so it must be
      # republished with `Publish platform images` before it can be paired. `cosign verify` needs no
      # `id-token`, so the permissions stay.
      - name: Install cosign for worker-base verification
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Verify worker-base signature
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ needs.worker-base.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/rh-aiservices-bu/school-of-sardeenz/\.github/workflows/publish-(platform-)?images\.yml@refs/heads/dev$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$BASE"

      - name: Build and push worker
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./containers/worker/Containerfile
          build-args: |
            WORKER_BASE_IMAGE=${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ needs.worker-base.outputs.digest }}
          tags: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker:${{ inputs.tag }}-staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-worker
          cache-to: type=gha,mode=max,scope=publish-worker,ignore-error=true

      # Two scans, one gate: the report scan feeds code scanning, the gate scan blocks on a fixable
      # CRITICAL. Scan before sign: a rejected image must stay unsigned.
      - name: Scan worker by digest — report CRITICAL + HIGH
        id: scan-report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action has no `platform` input; Trivy maps every CLI flag to TRIVY_<FLAG>,
          # so this is `trivy image --platform linux/amd64 …` (the pushed digest is an index).
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: 'false'
          exit-code: '0'
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Upload worker vulnerability report
        if: always() && steps.scan-report.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

      - name: Gate — fail on fixed CRITICAL vulnerabilities (worker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Sign worker by digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode legacy "$IMAGE"

      # Promote last, by digest — see the services job: `imagetools create` copies the manifest list,
      # so the digest and its signature are unchanged, and a gate failure never reaches this step.
      - name: Promote worker to ${{ inputs.tag }}
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$REPOSITORY:$TAG" "$REPOSITORY@$DIGEST"

      - name: Log out of Quay
        if: always()
        run: docker logout "$REGISTRY" || true
