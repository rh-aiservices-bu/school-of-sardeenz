name: Dependency advisories

# Nightly advisory sweep (#338). Advisory data changes without a commit, so this cannot gate PRs:
# findings are reported through one durable tracking issue instead of a red run. The run is green
# when the sweep worked (with or without findings) and red only when a check could not execute.
on:
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC — off the top-of-hour scheduling spike
  workflow_dispatch:
    inputs:
      fixture_dir: # rehearsal hook: exercise the issue lifecycle from committed fixtures
        description: 'Report from this fixture dir instead of the real audit output (e.g. tests/security/fixtures/findings)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  audit:
    name: Collect advisories (npm, cargo, pip)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: .python-version }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: npm audit (root lockfile = every workspace)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          # Reads package-lock.json only — no `npm ci` needed (verified). --audit-level affects the
          # exit code, not the JSON; the report applies the high/critical threshold.
          npm audit --audit-level=high --json > "$RUNNER_TEMP/audit/npm.json" || true
      - name: cargo audit (proxy/Cargo.lock)
        run: |
          set -euo pipefail
          cargo install --locked --version 0.23.0 cargo-audit
          cargo audit --format json --file proxy/Cargo.lock > "$RUNNER_TEMP/audit/cargo.json" || true
      - name: pip-audit over the constrained runner install (#182)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          PATH="$PWD/.venv/bin:$PATH" make test-python-deps   # constrained by -c runners/ci-constraints.txt (#182)
          .venv/bin/pip freeze --exclude-editable > "$RUNNER_TEMP/audit/requirements-runners.txt"
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "pip-audit==2.10.1"
          "$RUNNER_TEMP/tools/bin/pip-audit" -r "$RUNNER_TEMP/audit/requirements-runners.txt" \
            --format json --progress-spinner off > "$RUNNER_TEMP/audit/pip-runners.json" || true
      - name: pip-audit over the docs requirements
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/pip-audit" -r requirements-docs.txt \
            --format json --progress-spinner off > "$RUNNER_TEMP/audit/pip-docs.json" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-results
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 7

  report:
    name: File, update or close the tracking issue
    needs: audit
    if: always() && needs.audit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true # a failed audit job must still produce a report
        with: { name: audit-results, path: '${{ runner.temp }}/audit' }
      - name: Render the report
        continue-on-error: true # exit 1 (findings) / 2 (incomplete) are reported, not step failures
        env:
          INPUT_FIXTURE_DIR: ${{ github.event.inputs.fixture_dir }}
        run: |
          set -euo pipefail
          input="${INPUT_FIXTURE_DIR:-$RUNNER_TEMP/audit}"
          node tests/security/report-advisories.mjs --input "$input" --out "$RUNNER_TEMP/audit" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: File, update, reopen or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT: ${{ runner.temp }}/audit
        run: |
          set -euo pipefail
          title="$(cat "$OUT/issue-title.txt")"
          status="$(cat "$OUT/status.txt")"
          number="$(gh issue list --repo "$REPO" --state all --limit 1 \
            --search "in:title \"$title\" label:area/security" \
            --json number --jq '.[0].number // empty')"
          if [ "$status" = "clean" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" --comment "$(cat "$OUT/issue-body.md")"
            else
              echo "No findings; no tracking issue open."
            fi
          elif [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" --label area/security --body-file "$OUT/issue-body.md"
          else
            gh issue reopen "$number" --repo "$REPO"
            gh issue edit "$number" --repo "$REPO" --body-file "$OUT/issue-body.md"
          fi
      - name: Fail the run only when a check could not execute
        if: always()
        run: |
          status="$(cat "$RUNNER_TEMP/audit/status.txt" 2>/dev/null || echo crashed)"
          echo "report status: $status"
          [ "$status" = "clean" ] || [ "$status" = "findings" ]
