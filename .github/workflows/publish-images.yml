name: Publish impacted images

# Runs on every merge to dev. Detects which platform images are impacted by
# the merge's changed paths, builds only those, tags them with the merge
# commit's short sha (the 7-char form `git log --oneline` shows), and pushes
# them to Quay. Worker-base/worker are digest-paired: worker always builds FROM
# the digest of the worker-base built in the same run, and a worker-only change
# fetches the last published worker-base digest from Quay — verifying its cosign
# signature (this repository's publish workflows on `dev`) first, so an unsigned
# or foreign base aborts the build instead of being re-signed as a worker.
#
# Impact map (mirrors the Dockerfiles' actual COPY graphs):
#   proxy/**                                     → proxy
#   control-plane/** or containers/control-plane/** → control-plane
#   dashboard/**    or containers/dashboard/**   → dashboard
#   packages/**, package.json, package-lock.json,
#   tsconfig*.json (shared code)                 → control-plane + dashboard
#   containers/worker-base/**                    → worker-base, then worker
#   containers/worker/**                         → worker (from last worker-base)
#   nothing matching (docs, CI, CHANGELOG only)  → no build, job exits green
#
# Supply chain (ADR-030): each image is scanned by digest after the push (Trivy: a fixed CRITICAL
# fails the run; CRITICAL-unfixed and HIGH go to GitHub code scanning) and only then signed keyless
# with cosign by digest. The signature's trust anchor is THIS FILE'S identity:
#   https://github.com/rh-aiservices-bu/school-of-sardeenz/.github/workflows/publish-images.yml@refs/heads/dev
# Renaming this file changes the verification identity documented in ADR-030.

run-name: Publish impacted images :${{ github.sha }} from ${{ github.ref_name }}

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  QUAY_NAMESPACE: rh-aiservices-bu

jobs:
  ci-green:
    # Publish is blocked until CI turns green on this sha. The CI workflow
    # (ci.yml) fires on the same push; on a merged PR whose head already ran
    # green, its push-run triage skips the gates and the run concludes success
    # without re-testing; otherwise the gates re-run here first. Waiting on the
    # run via the check-runs API (not `needs:` — different workflow file).
    name: Wait for CI green
    runs-on: ubuntu-latest
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - name: Wait for the CI run on this sha
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # GitHub starts the CI run on this push within seconds. Poll the
          # check-runs API for every CI check on this sha until all three
          # (quality / e2e / python) are completed, then require success.
          expected=("typecheck / lint / test" "dashboard e2e (Playwright)" "runner shims + conformance (pytest)")

          for attempt in $(seq 1 120); do
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > /tmp/checks.json
            completed=true
            failed=false
            found_any=false
            for name in "${expected[@]}"; do
              conclusion="$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                --jq "[.check_runs[] | select(.name == \"$name\")][0].conclusion // \"missing\"")"
              if [[ "$conclusion" == "missing" || "$conclusion" == "pending" || "$conclusion" == "queued" || "$conclusion" == "in_progress" ]]; then
                completed=false
              elif [[ "$conclusion" != "success" && "$conclusion" != "skipped" && "$conclusion" != "neutral" ]]; then
                failed=true
              fi
              if [[ "$conclusion" != "missing" ]]; then found_any=true; fi
            done

            if [[ "$failed" == true ]]; then
              echo "CI checks failed on $SHA — publish blocked."
              echo "green=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$completed" == true ]]; then
              echo "All CI checks green on $SHA."
              echo "green=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "CI checks did not settle after 20 minutes — publish blocked."
          echo "green=false" >> "$GITHUB_OUTPUT"

  detect:
    name: Detect impacted images
    needs: ci-green
    if: needs.ci-green.outputs.green == 'true'
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.map.outputs.proxy }}
      control-plane: ${{ steps.map.outputs.control-plane }}
      dashboard: ${{ steps.map.outputs.dashboard }}
      worker-base: ${{ steps.map.outputs.worker-base }}
      worker: ${{ steps.map.outputs.worker }}
      any: ${{ steps.map.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Map changed paths to images
        id: map
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # For the first push after a branch creation github.event.before is the
          # zero sha — diff the new commit against its parent instead.
          if [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
            BEFORE="$(git rev-parse "$AFTER^")"
          fi

          # Squash merges carry the whole PR; merge commits diff against the
          # first parent so only the merged changes count.
          if git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          else
            changed="$(git diff --name-only "$AFTER^" "$AFTER")"
          fi
          echo "Changed paths between $BEFORE and $AFTER:"
          echo "$changed"
          echo "$changed" > /tmp/changed.txt

          has() { grep -qE "$1" /tmp/changed.txt; }

          proxy=false
          control_plane=false
          dashboard=false
          worker_base=false
          worker=false

          if has '^proxy/'; then
            proxy=true
          fi

          if has '^(control-plane/|containers/control-plane/)'; then
            control_plane=true
          fi

          if has '^(dashboard/|containers/dashboard/)'; then
            dashboard=true
          fi

          # Shared code: workspaces consumed by both control-plane and dashboard
          # (packages/contracts, packages/types, packages/utils), the root
          # manifests that drive npm ci, and the shared tsconfig graph.
          if has '^(packages/|package\.json$|package-lock\.json$|tsconfig[^/]*\.json$)'; then
            control_plane=true
            dashboard=true
          fi

          if has '^containers/worker-base/'; then
            worker_base=true
            worker=true
          elif has '^containers/worker/'; then
            worker=true
          fi

          any=false
          if [[ "$proxy" == true || "$control_plane" == true || "$dashboard" == true || "$worker" == true ]]; then
            any=true
          fi

          {
            echo "proxy=$proxy"
            echo "control-plane=$control_plane"
            echo "dashboard=$dashboard"
            echo "worker-base=$worker_base"
            echo "worker=$worker"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

          echo "Impacted images: proxy=$proxy control-plane=$control_plane dashboard=$dashboard worker-base=$worker_base worker=$worker"

  images:
    name: Publish ${{ matrix.role }}
    needs: detect
    # matrix context is NOT available in jobs.<job_id>.if (github, needs, vars,
    # inputs only) — the build decision lives in the first step's if instead.
    if: needs.detect.outputs.any == 'true'
    permissions:
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: proxy
            build: ${{ needs.detect.outputs.proxy == 'true' }}
            context: ./proxy
            file: ./proxy/Dockerfile
            repository: sardeenz-proxy
          - role: control-plane
            build: ${{ needs.detect.outputs.control-plane == 'true' }}
            context: .
            file: ./containers/control-plane/Dockerfile
            repository: sardeenz-control-plane
          - role: dashboard
            build: ${{ needs.detect.outputs.dashboard == 'true' }}
            context: .
            file: ./containers/dashboard/Dockerfile
            repository: sardeenz-dashboard
          - role: worker-base
            build: ${{ needs.detect.outputs.worker-base == 'true' }}
            context: ./containers/worker-base
            file: ./containers/worker-base/Containerfile
            repository: sardeenz-worker-base
    steps:
      # matrix.build gates every step: matrix context IS available in steps.if
      # (unlike jobs.if), so a non-impacted role skips without building.
      - name: Skip — not impacted
        id: gate
        if: matrix.build != true
        run: echo "role=${{ matrix.role }} is not impacted by this merge — skipping."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.build
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: matrix.build

      - name: Log in to Quay
        if: matrix.build
        env:
          QUAY_ROBOT_SARDEENZ_USERNAME: ${{ secrets.QUAY_ROBOT_SARDEENZ_USERNAME }}
          QUAY_ROBOT_SARDEENZ_TOKEN: ${{ secrets.QUAY_ROBOT_SARDEENZ_TOKEN }}
        run: |
          : "${QUAY_ROBOT_SARDEENZ_USERNAME:?QUAY_ROBOT_SARDEENZ_USERNAME secret is required}"
          : "${QUAY_ROBOT_SARDEENZ_TOKEN:?QUAY_ROBOT_SARDEENZ_TOKEN secret is required}"
          printf '%s' "$QUAY_ROBOT_SARDEENZ_TOKEN" \
            | docker login "$REGISTRY" --username "$QUAY_ROBOT_SARDEENZ_USERNAME" --password-stdin

      - name: Compute image tag
        if: matrix.build
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.role }}
        if: matrix.build
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.role }},ignore-error=true

      # Two scans, one gate: Trivy's severity drives both display and exit code, so a single scan
      # cannot both gate on a fixable CRITICAL and report HIGH. Scan before sign: a rejected image
      # must stay unsigned.
      - name: Scan ${{ matrix.role }} by digest — report CRITICAL + HIGH
        id: scan-report
        if: matrix.build
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action has no `platform` input; Trivy maps every CLI flag to TRIVY_<FLAG>,
          # so this is `trivy image --platform linux/amd64 …` (the pushed digest is an index).
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.role }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: 'false'
          exit-code: '0'
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Upload ${{ matrix.role }} vulnerability report
        if: always() && matrix.build && steps.scan-report.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-${{ matrix.role }}.sarif
          category: trivy-${{ matrix.role }}

      - name: Gate — fail on fixed CRITICAL vulnerabilities (${{ matrix.role }})
        if: matrix.build
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Install cosign
        if: matrix.build
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Sign ${{ matrix.role }} by digest (keyless)
        if: matrix.build
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode legacy "$IMAGE"

      - name: Log out of Quay
        if: always() && matrix.build
        run: docker logout "$REGISTRY" || true

  worker:
    name: Publish worker
    needs: [detect, images]
    if: needs.detect.outputs.worker == 'true'
    permissions:
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay
        env:
          QUAY_ROBOT_SARDEENZ_USERNAME: ${{ secrets.QUAY_ROBOT_SARDEENZ_USERNAME }}
          QUAY_ROBOT_SARDEENZ_TOKEN: ${{ secrets.QUAY_ROBOT_SARDEENZ_TOKEN }}
        run: |
          : "${QUAY_ROBOT_SARDEENZ_USERNAME:?QUAY_ROBOT_SARDEENZ_USERNAME secret is required}"
          : "${QUAY_ROBOT_SARDEENZ_TOKEN:?QUAY_ROBOT_SARDEENZ_TOKEN secret is required}"
          printf '%s' "$QUAY_ROBOT_SARDEENZ_TOKEN" \
            | docker login "$REGISTRY" --username "$QUAY_ROBOT_SARDEENZ_USERNAME" --password-stdin

      - name: Compute image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"

      # Digest-paired builds: when worker-base was rebuilt in this run, worker
      # builds FROM that digest (re-queried from Quay by sha tag). A worker-only
      # change pairs with the last published worker-base digest from the
      # `latest` tag, so base and worker in one run always match.
      - name: Resolve worker-base digest
        id: base
        env:
          WORKER_BASE_BUILT: ${{ needs.detect.outputs.worker-base == 'true' }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$WORKER_BASE_BUILT" == true ]]; then
            digest="$(docker buildx imagetools inspect \
              "$REGISTRY/$QUAY_NAMESPACE/sardeenz-worker-base:${SHA::7}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
          else
            digest="$(docker buildx imagetools inspect \
              "$REGISTRY/$QUAY_NAMESPACE/sardeenz-worker-base:latest" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pairing worker with worker-base@$digest"

      # Pairing consumes only a worker-base that this repository's publish workflows signed from
      # `dev`: an unsigned or foreign base aborts the build here (fail-closed), so a moved `latest`
      # cannot be laundered into a signed worker. `cosign verify` needs no `id-token`, so the job's
      # permissions are unchanged. A `latest` published before #266 carries no signature yet —
      # republish it with `Publish platform images` before the first worker-only merge, or that
      # merge fails at this step.
      - name: Install cosign for worker-base verification
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Verify worker-base signature
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/rh-aiservices-bu/school-of-sardeenz/\.github/workflows/publish-(platform-)?images\.yml@refs/heads/dev$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$BASE"

      - name: Build and push worker
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./containers/worker/Containerfile
          build-args: |
            WORKER_BASE_IMAGE=${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker-base@${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-worker
          cache-to: type=gha,mode=max,scope=publish-worker,ignore-error=true

      # Two scans, one gate: the report scan feeds code scanning, the gate scan blocks on a fixable
      # CRITICAL. Scan before sign: a rejected image must stay unsigned.
      - name: Scan worker by digest — report CRITICAL + HIGH
        id: scan-report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action has no `platform` input; Trivy maps every CLI flag to TRIVY_<FLAG>,
          # so this is `trivy image --platform linux/amd64 …` (the pushed digest is an index).
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: 'false'
          exit-code: '0'
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Upload worker vulnerability report
        if: always() && steps.scan-report.conclusion == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

      - name: Gate — fail on fixed CRITICAL vulnerabilities (worker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.76.2

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Sign worker by digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.QUAY_NAMESPACE }}/sardeenz-worker@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode legacy "$IMAGE"

      - name: Log out of Quay
        if: always()
        run: docker logout "$REGISTRY" || true

  noop:
    name: No impacted images
    needs: [ci-green, detect]
    if: always() && needs.ci-green.outputs.green == 'true' && needs.detect.outputs.any != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report no build
        run: echo "No platform image is impacted by this merge — nothing to build or push."

  blocked:
    name: Publish blocked — CI not green
    needs: [ci-green, detect]
    if: always() && needs.ci-green.outputs.green != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report blocked
        run: echo "Publish blocked — CI did not turn green on this sha; check the CI run for this push."
