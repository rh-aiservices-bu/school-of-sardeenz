name: CI

# Quality gates only — no image builds. It enforces every gate that previously
# ran only manually: typecheck, ESLint, clippy, OpenAPI spec validation
# (redocly), unit tests (vitest + cargo test), and contract-codegen drift.
#
# PR runs (event=pull_request) always execute. Push runs (merges to dev/main)
# execute only when the pushed tree has not already been tested green by the
# PR run: `triage` compares the pushed sha against the merged PR's head sha
# (same git tree ⇒ identical content ⇒ the tests just passed on it) and skips
# the three gate jobs when a green pull_request run exists. A direct push to
# dev, or a merge whose head never turned green, always runs CI.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref so only the latest commit's CI matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  triage:
    # Decide whether the pushed tree still needs the gates. Only the push event
    # reaches here with an already-tested tree (PR merged); on pull_request the
    # triage job is skipped and the gates always run.
    name: Triage — already tested?
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    if: github.event_name == 'push'
    steps:
      - name: Check for a green CI run on the same tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A push of a merged PR is associated with exactly one closed PR via
          # commits/{sha}/pulls. A direct push matches no PR → run CI.
          if [[ "$(gh api "repos/$REPO/commits/$PUSH_SHA/pulls" --jq 'length')" -eq 0 ]]; then
            echo "Pushed sha is not associated with a merged PR → run CI."
            echo "tested=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The merged PR's head sha — the commit whose tree the merge commit
          # carries (GitHub merge commits keep the PR head's tree).
          pr_number="$(gh api "repos/$REPO/commits/$PUSH_SHA/pulls" --jq '.[0].number')"
          head_sha="$(gh api "repos/$REPO/pulls/$pr_number" --jq '.head.sha')"
          echo "Merged PR #$pr_number head: $head_sha"

          # Tree equality: identical content even if the shas differ (merge
          # strategy). If the trees differ, the pushed content was not what the
          # PR tested — run CI.
          push_tree="$(gh api "repos/$REPO/commits/$PUSH_SHA" --jq '.commit.tree.sha')"
          head_tree="$(gh api "repos/$REPO/commits/$head_sha" --jq '.commit.tree.sha')"
          if [[ "$push_tree" != "$head_tree" ]]; then
            echo "Pushed tree $push_tree differs from PR head tree $head_tree → run CI."
            echo "tested=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Green pull_request CI run on that head?
          green="$(gh api \
            "repos/$REPO/actions/runs?head_sha=$head_sha&event=pull_request&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | length')"
          if [[ "$green" -gt 0 ]]; then
            echo "PR head $head_sha has a green CI run on the same tree → skip gates."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No green CI run on $head_sha → run CI."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: typecheck / lint / test
    needs: triage
    if: always() && (needs.triage.result == 'skipped' || needs.triage.outputs.tested != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Makefile guards its Rust recipes with `ifdef CARGO`. If cargo is
      # absent, `make all`/`make test` silently degrade to the TypeScript half
      # — clippy/check/test never run. We install Rust explicitly so those
      # recipes actually execute, and assert it below.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: proxy

      - run: npm ci

      - run: make all # typecheck (tsc --build + cargo check) + lint (eslint + clippy + redocly)

      - run: make test # vitest run + cargo test

      - name: Verify proxy Docker MSRV
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          ./tests/container-images/verify-proxy-msrv.sh

      - name: Verify service runtime package resolution
        run: node tests/container-images/verify-runtime-packaging.mjs

      - name: Codegen drift
        run: |
          npm run codegen -w @sardeenz/types
          git diff --exit-code packages/types/src/generated/

      # Because `ifdef CARGO` makes a cargo-less runner pass make targets while
      # skipping all Rust gates, explicitly prove cargo/clippy were present so a
      # regression in Rust setup fails loudly instead of silently green.
      - name: Assert Rust steps actually ran
        if: always()
        run: cargo --version && cd proxy && cargo clippy --version

  # Container image builds are NOT part of PR CI: the publish workflow
  # (publish-images.yml) builds and pushes only the images impacted by a merge
  # to dev, tagged with the merge commit's short sha.
  e2e:
    name: dashboard e2e (Playwright)
    needs: triage
    if: always() && (needs.triage.result == 'skipped' || needs.triage.outputs.tested != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SARDEENZ_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run dashboard e2e
        run: npm run test:e2e -w @sardeenz/dashboard

  python:
    name: runner shims + conformance (pytest)
    needs: triage
    if: always() && (needs.triage.result == 'skipped' || needs.triage.outputs.tested != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      # The shims + shared conformance suite exercise real FastAPI apps against FAKE engines, so the
      # only deps are fastapi/httpx/pytest (via each shim's [test] extra) — never vllm/torch/mlserver.
      - name: Install shim test deps
        run: make test-python-deps
      - name: Run Python test suites
        run: make test-python

# Deliberately NOT gated here (tracked separately, not part of #82):
#   - `make format-check`: `npx prettier --check .` fails on 34 files today; it
#     is not in `make all`, so excluding it does not weaken this pipeline.
#   - `make test-integration`: remains a separate application integration suite.
#   - index-completeness check (#81).
# Container image builds run only in publish-images.yml, on merges to dev: it
# detects the impacted images from the changed paths, builds just those, and
# pushes them tagged with the merge commit's short sha. runner/SIF images,
# image scanning, multi-architecture builds, and branch protection remain out
# of scope.
