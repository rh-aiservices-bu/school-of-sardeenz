name: CI

# No CI existed before this workflow (#82). It enforces every quality gate that
# previously ran only manually: typecheck, ESLint, clippy, OpenAPI spec
# validation (redocly), unit tests (vitest + cargo test), contract-codegen
# drift, and build-and-run smoke tests for the three service images.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref so only the latest commit's CI matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Makefile guards its Rust recipes with `ifdef CARGO`. If cargo is
      # absent, `make all`/`make test` silently degrade to the TypeScript half
      # — clippy/check/test never run. We install Rust explicitly so those
      # recipes actually execute, and assert it below.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: proxy

      - run: npm ci

      - run: make all # typecheck (tsc --build + cargo check) + lint (eslint + clippy + redocly)

      - run: make test # vitest run + cargo test

      - name: Verify proxy Docker MSRV
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          ./tests/container-images/verify-proxy-msrv.sh

      - name: Verify service runtime package resolution
        run: node tests/container-images/verify-runtime-packaging.mjs

      - name: Codegen drift
        run: |
          npm run codegen -w @sardeenz/types
          git diff --exit-code packages/types/src/generated/

      # Because `ifdef CARGO` makes a cargo-less runner pass make targets while
      # skipping all Rust gates, explicitly prove cargo/clippy were present so a
      # regression in Rust setup fails loudly instead of silently green.
      - name: Assert Rust steps actually ran
        if: always()
        run: cargo --version && cd proxy && cargo clippy --version

  containers:
    name: ${{ matrix.service }} container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: proxy
            context: ./proxy
            file: ./proxy/Dockerfile
            image: sardeenz-proxy:ci
            port: 9099
          - service: control-plane
            context: .
            file: ./containers/control-plane/Dockerfile
            image: sardeenz-control-plane:ci
            port: 3000
          - service: dashboard
            context: .
            file: ./containers/dashboard/Dockerfile
            image: sardeenz-dashboard:ci
            port: 4000
    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sardeenz
          POSTGRES_PASSWORD: sardeenz
          POSTGRES_DB: sardeenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sardeenz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SARDEENZ_REDIS_URL: redis://host.docker.internal:6379
      SARDEENZ_DATABASE_URL: postgresql://sardeenz:sardeenz@host.docker.internal:5432/sardeenz
      SARDEENZ_SINGLE_INSTANCE: 'true'
      AUTH_MODE: simple
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      JWT_SECRET: ci-jwt-secret-for-container-smoke-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=containers-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=containers-${{ matrix.service }},ignore-error=true

      - name: Start ${{ matrix.service }} container
        run: |
          docker run --detach \
            --name sardeenz-${{ matrix.service }}-ci \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:${{ matrix.port }}:${{ matrix.port }} \
            --env SARDEENZ_REDIS_URL \
            --env SARDEENZ_DATABASE_URL \
            --env SARDEENZ_SINGLE_INSTANCE \
            --env AUTH_MODE \
            --env ADMIN_USERNAME \
            --env ADMIN_PASSWORD \
            --env JWT_SECRET \
            ${{ matrix.image }}

      - name: Wait for ${{ matrix.service }} health endpoint
        run: |
          container=sardeenz-${{ matrix.service }}-ci
          # Thirty checks, each with a one-second request timeout and a one-second
          # pause, give the service roughly one minute to start without claiming a
          # strict wall-clock bound for command overhead.
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 1 --fail --silent --show-error http://127.0.0.1:${{ matrix.port }}/healthz; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "$container exited before its health endpoint became available"
              docker logs "$container" || true
              exit 1
            fi
            sleep 1
          done
          echo "$container did not become healthy after 30 checks (roughly one minute)"
          docker logs "$container" || true
          exit 1

      - name: Diagnose container smoke-test failure
        if: failure()
        run: |
          docker ps --all
          docker logs sardeenz-${{ matrix.service }}-ci || true

      - name: Remove ${{ matrix.service }} container
        if: always()
        run: docker rm --force sardeenz-${{ matrix.service }}-ci || true

  e2e:
    name: dashboard e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SARDEENZ_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run dashboard e2e
        run: npm run test:e2e -w @sardeenz/dashboard

  python:
    name: runner shims + conformance (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      # The shims + shared conformance suite exercise real FastAPI apps against FAKE engines, so the
      # only deps are fastapi/httpx/pytest (via each shim's [test] extra) — never vllm/torch/mlserver.
      - name: Install shim test deps
        run: make test-python-deps
      - name: Run Python test suites
        run: make test-python

# Deliberately NOT gated here (tracked separately, not part of #82):
#   - `make format-check`: `npx prettier --check .` fails on 34 files today; it
#     is not in `make all`, so excluding it does not weaken this pipeline.
#   - `make test-integration`: remains a separate application integration suite.
#   - index-completeness check (#81).
# Container image builds and `/healthz` smoke tests run above. Platform publishing is manual in
# publish-platform-images.yml; runner/SIF images, scanning, multi-architecture builds, automatic
# release publishing, and branch protection remain out of scope.
