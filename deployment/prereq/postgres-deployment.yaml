apiVersion: apps/v1
kind: Deployment
metadata:
  name: sardeenz-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sardeenz-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sardeenz-postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sardeenz-postgres-credentials
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sardeenz-postgres
