apiVersion: apps/v1
kind: Deployment
metadata:
  name: sardeenz-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sardeenz-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sardeenz-control-plane
    spec:
      serviceAccountName: sardeenz-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: quay.io/rh-aiservices-bu/sardeenz-control-plane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SARDEENZ_CONTROL_PLANE_LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: SARDEENZ_REDIS_URL
              value: redis://sardeenz-redis:6379
            - name: SARDEENZ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-postgres-credentials
                  key: SARDEENZ_DATABASE_URL
            - name: SARDEENZ_LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Node's built-in fetch does not automatically trust the mounted Kubernetes CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: SARDEENZ_MODULES_DIR
              value: /modules
            - name: SARDEENZ_WEIGHTS_DIR
              value: /weights
            - name: SARDEENZ_SIF_IMPORTER
              value: oras
            - name: HOME
              value: /tmp/sardeenz
            - name: APPTAINER_AUTH_FILE
              value: /etc/sardeenz/registry/auth.json
            - name: SARDEENZ_VERIFY_SIF
              value: 'true'
            - name: SARDEENZ_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sardeenz-service-tokens
                  key: SARDEENZ_API_TOKEN
            - name: SARDEENZ_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sardeenz-service-tokens
                  key: SARDEENZ_WORKER_TOKEN
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
          volumeMounts:
            - name: modules
              mountPath: /modules
            - name: weights
              mountPath: /weights
              readOnly: true
            - name: signing-key
              mountPath: /etc/sardeenz/keys
              readOnly: true
            - name: registry-auth
              mountPath: /etc/sardeenz/registry
              readOnly: true
      volumes:
        - name: modules
          persistentVolumeClaim:
            claimName: sardeenz-modules
        - name: weights
          persistentVolumeClaim:
            claimName: sardeenz-weights
        - name: signing-key
          configMap:
            name: sardeenz-sif-signing-pubkey
            optional: true
        - name: registry-auth
          secret:
            secretName: sardeenz-librarian-registry
            optional: true
            items:
              - key: .dockerconfigjson
                path: auth.json
