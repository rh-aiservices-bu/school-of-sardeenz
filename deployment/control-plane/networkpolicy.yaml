# Restricts ingress to the control plane Service to the routing proxy and dashboard BFF only
# (see docs/usage/deployment-security.md — the control plane has no authentication of its own
# beyond the optional SARDEENZ_API_TOKEN shared secret, so network isolation is the primary
# boundary). Any other pod in the namespace is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sardeenz-control-plane
  labels:
    app.kubernetes.io/name: sardeenz-control-plane
    app.kubernetes.io/part-of: sardeenz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sardeenz-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sardeenz-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sardeenz-dashboard
      ports:
        - protocol: TCP
          port: 3000
