apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-control-plane-leader-election
rules:
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['create', 'delete', 'get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-control-plane-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-control-plane-leader-election
subjects:
  - kind: ServiceAccount
    name: sardeenz-control-plane
