# Restricts ingress to the worker Pod (see docs/usage/deployment-security.md). The worker agent
# and engine listeners have optional or no authentication, so these same-namespace, component
# selectors are the primary boundary. Keep the port lists aligned with the worker env below:
# [SARDEENZ_RUNNER_PORT_START, + SARDEENZ_MAX_RUNNERS * 4), stride 4.
# Do not replace these lists with a range: the gRPC (+2) and metrics (+3) ports are deliberately
# not reachable. Overlays that change either runner port setting must update this policy too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sardeenz-worker
  labels:
    app.kubernetes.io/name: sardeenz-worker
    app.kubernetes.io/part-of: sardeenz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sardeenz-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sardeenz-control-plane
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9105
        - protocol: TCP
          port: 9109
        - protocol: TCP
          port: 9113
