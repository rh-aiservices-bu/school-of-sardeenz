# Ensure `crun` is the container runtime (spike §9.7). crun is the default on modern OpenShift/OKD
# 4.x; apply this ONLY if a node pool defaults to `runc` (runc's stricter handling breaks the
# in-container userns path). This triggers a rolling MachineConfig update — apply during a
# maintenance window. Delete/skip if crun is already the default.
apiVersion: machineconfiguration.openshift.io/v1
kind: ContainerRuntimeConfig
metadata:
  name: sardeenz-enable-crun
spec:
  machineConfigPoolSelector:
    matchLabels:
      # Target the worker pool that runs Sardeenz worker Pods.
      pools.operator.machineconfiguration.openshift.io/worker: ''
  containerRuntimeConfig:
    defaultRuntime: crun
