# Worker ServiceAccount + the RBAC that lets it *use* the custom SCC.
# In OpenShift, granting an SCC to an SA is done by binding a Role that allows `use` on the SCC
# resource (equivalent to `oc adm policy add-scc-to-user sardeenz-sif-runner -z sardeenz-worker`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sardeenz-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-use-sif-runner-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["sardeenz-sif-runner"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-worker-sif-runner-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-use-sif-runner-scc
subjects:
  - kind: ServiceAccount
    name: sardeenz-worker
