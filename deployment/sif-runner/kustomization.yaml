apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default target namespace (override in an overlay).
namespace: sardeenz

resources:
  - scc.yaml
  - rbac.yaml
  - pvcs.yaml
  - worker-deployment.yaml
  - module-pvc-write-protection.yaml
  - networkpolicy.yaml

# NOT included by default (apply deliberately, they are cluster-scoped / disruptive):
#   - containerruntimeconfig.yaml   # only if a node pool defaults to runc; triggers a MC roll
labels:
  - pairs:
      app.kubernetes.io/part-of: sardeenz
    includeSelectors: false
