# Sardeenz marker Roles are intentionally not backed by real API resources. They express
# dashboard privileges through ordinary namespace-scoped OpenShift/Kubernetes RBAC bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sardeenz-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-admin
rules:
  - apiGroups: ['sardeenz.rh-aiservices-bu.io']
    resources: ['admin']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-admin-readonly
rules:
  - apiGroups: ['sardeenz.rh-aiservices-bu.io']
    resources: ['admin-readonly']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-auth-reviewer
rules:
  - apiGroups: ['authorization.k8s.io']
    resources: ['localsubjectaccessreviews']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-auth-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-auth-reviewer
subjects:
  - kind: ServiceAccount
    name: sardeenz-dashboard
---
# The Thanos Querier tenancy port (9092) authorises the caller's bearer token with a
# SubjectAccessReview for `get pods` in API group `metrics.k8s.io` (the pod-metrics resource, not
# core Pods) in the namespace given by the `namespace` query parameter. The dashboard BFF's
# ServiceAccount needs exactly that verb/resource pair, purely to satisfy the check.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-dashboard-metrics-reader
rules:
  - apiGroups: ['metrics.k8s.io']
    resources: ['pods']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-dashboard-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-dashboard-metrics-reader
subjects:
  - kind: ServiceAccount
    name: sardeenz-dashboard
