apiVersion: apps/v1
kind: Deployment
metadata:
  name: sardeenz-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sardeenz-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sardeenz-dashboard
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: quay.io/rh-aiservices-bu/sardeenz-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SARDEENZ_BFF_LISTEN_ADDR
              value: 0.0.0.0:4000
            - name: SARDEENZ_CONTROL_PLANE_URL
              value: http://sardeenz-control-plane:3000
            - name: SARDEENZ_REDIS_URL
              value: redis://sardeenz-redis:6379
            - name: SARDEENZ_INFERENCE_URL
              value: http://sardeenz-proxy:8080
            - name: SARDEENZ_PROMETHEUS_URL
              value: http://sardeenz-prometheus:9090
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SARDEENZ_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sardeenz-service-tokens
                  key: SARDEENZ_API_TOKEN
          envFrom:
            - secretRef:
                name: sardeenz-dashboard-auth
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
