# The librarian ServiceAccount creates the native OCI Build and runs rootless Apptainer conversion.
# It needs the sardeenz-sif-runner SCC because `apptainer build` creates a user namespace just like
# `apptainer exec` does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sardeenz-librarian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-librarian-use-sif-runner-scc
rules:
  - apiGroups: ['security.openshift.io']
    resources: ['securitycontextconstraints']
    resourceNames: ['sardeenz-sif-runner']
    verbs: ['use']
  # The librarian Job creates one native OpenShift Docker build, observes it, and reads its logs.
  # The build controller performs the actual Containerfile build in a separate build Pod.
  - apiGroups: ['build.openshift.io']
    resources: ['builds']
    verbs: ['create', 'get', 'list', 'watch']
  - apiGroups: ['build.openshift.io']
    resources: ['builds/log']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-librarian-sif-runner-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-librarian-use-sif-runner-scc
subjects:
  - kind: ServiceAccount
    name: sardeenz-librarian
