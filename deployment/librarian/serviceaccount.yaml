# The librarian ServiceAccount — the ONLY identity permitted to mount the module store read-write
# (the module-pvc write-protection VAP excludes this SA by name). It also needs the sardeenz-sif-runner
# SCC because `apptainer build` creates a user namespace just like `apptainer exec` does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sardeenz-librarian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-librarian-use-sif-runner-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["sardeenz-sif-runner"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-librarian-sif-runner-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sardeenz-librarian-use-sif-runner-scc
subjects:
  - kind: ServiceAccount
    name: sardeenz-librarian
