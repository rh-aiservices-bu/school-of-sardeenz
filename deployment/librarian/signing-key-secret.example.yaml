# OPTIONAL TEMPLATE — do NOT commit a real key. Used only when SIGN_SIF=true. The Apptainer PRIVATE
# signing key is mounted only into the librarian Job (never onto workers). Generate it out-of-band:
#
#   apptainer key newpair                              # follow prompts (use an empty passphrase
#                                                      # for unattended CI, or set APPTAINER_PASSPHRASE)
#   apptainer key export --secret --armor <fingerprint> sardeenz-sif-signing.private.asc
#   apptainer key export         --armor <fingerprint> sardeenz-sif-signing.pub
#
#   oc create secret generic sardeenz-sif-signing-key \
#     --from-file=private.asc=sardeenz-sif-signing.private.asc
#
#   # Distribute the PUBLIC key to workers (consumed by deployment/sif-runner worker Deployment):
#   oc create configmap sardeenz-sif-signing-pubkey \
#     --from-file=sardeenz-sif-signing.pub=sardeenz-sif-signing.pub
#
# This file is a placeholder so the manifest shape is reviewable; it is NOT in the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: sardeenz-sif-signing-key
type: Opaque
stringData:
  private.asc: |
    -----BEGIN PGP PRIVATE KEY BLOCK-----
    REPLACE_ME_WITH_THE_REAL_PRIVATE_KEY
    -----END PGP PRIVATE KEY BLOCK-----
