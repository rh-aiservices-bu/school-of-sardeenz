# Dev environment services for Sardeenz v2.
# Start:  podman compose up -d
# Stop:   podman compose down
# Reset:  podman compose down -v   (removes data volumes)
#
# Also works with: docker compose up -d
#
# Host ports and credentials are read from the repo-root .env (see .env.example).
# Only the host side of each mapping is configurable; the in-container ports stay fixed.
# When you change SARDEENZ_REDIS_HOST_PORT / SARDEENZ_POSTGRES_HOST_PORT, update the
# matching SARDEENZ_REDIS_URL / SARDEENZ_DATABASE_URL in the same .env so the apps connect.

services:
  redis:
    image: docker.io/valkey/valkey:8
    ports:
      - '127.0.0.1:${SARDEENZ_REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/postgres:16
    ports:
      - '127.0.0.1:${SARDEENZ_POSTGRES_HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${SARDEENZ_POSTGRES_USER:-sardeenz}
      POSTGRES_PASSWORD: ${SARDEENZ_POSTGRES_PASSWORD:-sardeenz}
      POSTGRES_DB: ${SARDEENZ_POSTGRES_DB:-sardeenz}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SARDEENZ_POSTGRES_USER:-sardeenz}']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
